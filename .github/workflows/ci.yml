name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    # 固定镜像：ubuntu-latest 已开始迁移到 26，Playwright 尚未支持
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @easy-component-ui/core build
      - run: pnpm run check:dist
      - run: pnpm run check:publint
      - run: pnpm run check:attw
      - run: pnpm --filter easy-component-ui exec playwright --version
      - run: pnpm --filter easy-component-ui exec playwright install --with-deps chromium
      - run: pnpm test:browser
