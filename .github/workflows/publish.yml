name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 校验 tag 与三包版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core/package.json packages/themes/package.json packages/components/package.json; do
            PKG_VERSION=$(node -p "require('./$pkg').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg 版本 ($PKG_VERSION) 与 tag ($TAG_VERSION) 不一致，请先通过 pnpm changeset + pnpm changeset:version 同步版本"
              exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # 发布走 OIDC Trusted Publishing（无需 NPM_TOKEN，需在 npm 各包 Settings 配置 trusted publisher）
      # 顺序遵循依赖方向 themes → core → components，pnpm publish 会将 workspace:* 替换为真实版本
      # CLI 与 mcp-server 版本独立演进，不参与 lockstep
      # 已存在的版本自动跳过，避免重复发布导致 E403，并保证失败后可直接重跑
      - name: 发布各包（已存在则跳过）
        run: |
          publish() {
            local dir="$1" name="$2"
            local version
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version 已存在于 npm，跳过发布"
            else
              (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
            fi
          }
          publish packages/themes "@easy-component-ui/themes"
          publish packages/core "@easy-component-ui/core"
          publish packages/components "easy-component-ui"
          publish packages/cli "@easy-component-ui/cli"
          publish packages/mcp-server "ea-ui-mcp-server"
