server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location /ea-ui-component/ {
        try_files $uri $uri/ $uri.html /ea-ui-component/404.html;

        location ~* \.(?:js|css|svg|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location = / {
        return 302 /ea-ui-component/;
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
