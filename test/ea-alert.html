<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }

      ea-alert {
        margin: 20px 0 0;
      }

      ea-alert:first-child {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <script src="../src/components/ea-alert/index.ts" type="module"></script>
    <script src="../src/components/ea-icon/index.js" type="module"></script>

    <!-- -------- 1. 基本用法 --------  -->
    <!-- #region  -->
    <h2>1. 基本用法</h2>
    <div class="demo">
      <ea-alert heading="Primary alert" variant="primary"></ea-alert>
      <ea-alert heading="Success alert" variant="success"></ea-alert>
      <ea-alert heading="Info alert" variant="info"></ea-alert>
      <ea-alert heading="Warning alert" variant="warning"></ea-alert>
      <ea-alert heading="Error alert" variant="danger"></ea-alert>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 2. 主题 --------  -->
    <!-- #region  -->
    <h2>2. 主题</h2>
    <div class="demo">
      <ea-alert
        heading="Primary alert"
        variant="primary"
        effect="dark"
      ></ea-alert>
      <ea-alert
        heading="Success alert"
        variant="success"
        effect="dark"
      ></ea-alert>
      <ea-alert heading="Info alert" variant="info" effect="dark"></ea-alert>
      <ea-alert
        heading="Warning alert"
        variant="warning"
        effect="dark"
      ></ea-alert>
      <ea-alert heading="Error alert" variant="danger" effect="dark"></ea-alert>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 3. 自定义关闭按钮 --------  -->
    <!-- #region  -->
    <h2>3. 自定义关闭按钮</h2>
    <div class="demo">
      <ea-alert
        heading="Unclosable alert"
        variant="success"
        closable="false"
      ></ea-alert>
      <ea-alert
        heading="Customized close text"
        variant="info"
        close-text="Gotcha"
      ></ea-alert>
      <ea-alert
        id="customizedCloseBtn"
        heading="Alert with callback"
        variant="warning"
      ></ea-alert>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 4. 带有 icon --------  -->
    <!-- #region  -->
    <h2>4. 带有 icon</h2>
    <div class="demo">
      <ea-alert heading="Primary alert" variant="primary" show-icon></ea-alert>
      <ea-alert heading="Success alert" variant="success" show-icon></ea-alert>
      <ea-alert heading="Info alert" variant="info" show-icon></ea-alert>
      <ea-alert heading="Warning alert" variant="warning" show-icon></ea-alert>
      <ea-alert heading="Error alert" variant="danger" show-icon></ea-alert>
      <ea-alert
        heading="Error alert with custom icon"
        variant="danger"
        show-icon
      >
        <ea-icon slot="icon" name="bell" color="red"></ea-icon>
      </ea-alert>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 5. 文字居中 --------  -->
    <!-- #region  -->
    <h2>5. 文字居中</h2>
    <div class="demo">
      <ea-alert
        heading="Primary alert"
        variant="primary"
        center
        show-icon
      ></ea-alert>
      <ea-alert
        heading="Success alert"
        variant="success"
        center
        show-icon
      ></ea-alert>
      <ea-alert heading="Info alert" variant="info" center show-icon></ea-alert>
      <ea-alert
        heading="Warning alert"
        variant="warning"
        center
        show-icon
      ></ea-alert>
      <ea-alert
        heading="Error alert"
        variant="danger"
        center
        show-icon
      ></ea-alert>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 6. 带有辅助性文字介绍 --------  -->
    <!-- #region  -->
    <h2>6. 带有辅助性文字介绍</h2>
    <style>
      .with-desc-and-icon::part(icon) {
        --ea-icon-size: 1.75rem !important;
      }
    </style>
    <div class="demo">
      <ea-alert
        class="with-desc-and-icon"
        heading="Primary alert"
        variant="primary"
        description="More text description"
        show-icon
      ></ea-alert>
      <ea-alert
        class="with-desc-and-icon"
        heading="Success alert"
        variant="success"
        description="More text description"
        show-icon
      ></ea-alert>
      <ea-alert
        class="with-desc-and-icon"
        heading="Info alert"
        variant="info"
        description="More text description"
        show-icon
      ></ea-alert>
      <ea-alert
        class="with-desc-and-icon"
        heading="Warning alert"
        variant="warning"
        description="More text description"
        show-icon
      ></ea-alert>
      <ea-alert
        class="with-desc-and-icon"
        heading="Error alert"
        variant="danger"
        show-icon
      >
        More text description
      </ea-alert>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- #region 延迟属性 -->
    <h1>延迟属性</h1>

    <div class="demo">
      <ea-alert
        id="showAfterAlert"
        heading="Primary alert that appearance after 5000 milliseconds"
        variant="primary"
        show-after="5000"
      ></ea-alert>
      <ea-alert
        id="hideAfterAlert"
        heading="Success alert that disappear after 5000 milliseconds"
        variant="success"
        hide-after="5000"
      ></ea-alert>
      <ea-alert
        id="autoCloseAlert"
        heading="Info alert that in 5000 milliseconds to be hidden"
        variant="info"
        closable="false"
        auto-close="5000"
      ></ea-alert>
    </div>

    <hr />
    <!-- #endregion  -->

    <script>
      // ------- 自定义关闭按钮 -------
      // #region
      const customizedCloseBtnExample = {
        container: document.querySelector("#customizedCloseBtn"),

        init() {
          this.container.addEventListener("close", () => {
            console.log("close");
          });
        },
      };
      customizedCloseBtnExample.init();
      // #endregion
      // ------- end -------

      // ------- 延迟属性 -------
      // #region
      const delayAttrExample = {
        showAfterAlert: document.querySelector("#showAfterAlert"),
        hideAfterAlert: document.querySelector("#hideAfterAlert"),
        autoCloseAlert: document.querySelector("#autoCloseAlert"),

        init() {
          this.showAfterAlert.addEventListener("open", () => {
            console.log("open");
          });

          this.hideAfterAlert.addEventListener("close", () => {
            console.log("close");
          });

          this.autoCloseAlert.addEventListener("close", () => {
            console.log("auto-close");
          });
        },
      };
      delayAttrExample.init();
      // #endregion
      // ------- end -------
    </script>
  </body>
</html>
