<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    
    <style>
      .row { margin: 1rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }

      .ea-card-demo {
        width: 400px;
      }

      .img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-card/index.ts"></script>
    <script type="module" src="../src/components/ea-button/index.ts"></script>

    <!-- -------- 基础用法 --------  -->
    <!-- #region  -->
    <h2>基础用法</h2>
    <div class="demo">
      <ea-card class="ea-card-demo">
        <div slot="header" class="header">
          <span>Card name</span>
        </div>

        <p class="ea-card-content">content1</p>
        <p class="ea-card-content">content2</p>
        <p class="ea-card-content">content3</p>
        <p class="ea-card-content">content4</p>

        <div slot="footer" class="footer">
          <span>Footer content</span>
        </div>
      </ea-card>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 简单卡片 --------  -->
    <!-- #region  -->
    <h2>简单卡片</h2>
    <div class="demo">
      <ea-card class="ea-card-demo">
        <p class="ea-card-content">content1</p>
        <p class="ea-card-content">content2</p>
        <p class="ea-card-content">content3</p>
        <p class="ea-card-content">content4</p>
      </ea-card>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 带图片 --------  -->
    <!-- #region  -->
    <h2>带图片</h2>
    <div class="demo">
      <ea-card class="ea-card-demo">
        <div class="header" slot="header">
          <span>view</span>
        </div>
        <img
          class="img"
          src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
        />
      </ea-card>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 卡片阴影 --------  -->
    <!-- #region  -->
    <h2>卡片阴影</h2>
    <div class="demo">
      <ea-card shadow="always">总是显示</ea-card>
      <p></p>
      <ea-card shadow="hover">鼠标移入显示</ea-card>
      <p></p>
      <ea-card shadow="never">从不显示</ea-card>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
