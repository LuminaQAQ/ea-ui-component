<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-skeleton/index.ts"></script>
    <script type="module" src="../src/components/ea-card/index.ts"></script>
    <script type="module" src="../src/components/ea-image/index.ts"></script>
    <script type="module" src="../src/components/ea-switch/index.ts"></script>
    <script type="module" src="../src/components/ea-button/index.ts"></script>

    <!-- -------- 骨架屏 --------  -->
    <!-- #region  -->
    <h2>骨架屏</h2>
    <div class="demo">
      <ea-skeleton></ea-skeleton>
      <br />
      <ea-skeleton>
        <ea-skeleton-item
          slot="template"
          variant="circle"
          style="--ea-skeleton-item-circle-size: 100px"
        ></ea-skeleton-item>
      </ea-skeleton>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 更多参数 --------  -->
    <!-- #region  -->
    <h2>更多参数</h2>
    <div class="demo">
      <ea-skeleton rows="6"></ea-skeleton>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 动画效果 --------  -->
    <!-- #region  -->
    <h2>动画效果</h2>
    <div class="demo">
      <ea-skeleton row="6" animated></ea-skeleton>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 自定义样式 --------  -->
    <!-- #region  -->
    <h2>自定义样式</h2>
    <div class="demo">
      <ea-skeleton style="width: 240px" animated>
        <div slot="template">
          <ea-skeleton-item
            variant="image"
            style="width: 240px; height: 240px"
          ></ea-skeleton-item>
          <div style="padding: 14px">
            <ea-skeleton-item variant="p" style="width: 50%"></ea-skeleton-item>
            <ea-skeleton-item
              variant="text"
              style="margin-right: 16px"
            ></ea-skeleton-item>
            <ea-skeleton-item
              variant="text"
              style="width: 30%"
            ></ea-skeleton-item>
          </div>
        </div>
      </ea-skeleton>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- Loading 状态 --------  -->
    <!-- #region  -->
    <h2>Loading 状态</h2>

    <div class="demo">
      <p>切换状态: <ea-switch id="loadingSwitch" value="true"></ea-switch></p>
      <ea-skeleton id="loadingSkeleton" style="width: 240px" animated>
        <div slot="template">
          <ea-skeleton-item
            variant="image"
            style="width: 240px; height: 150px"
          ></ea-skeleton-item>
          <div style="padding: 14px">
            <ea-skeleton-item
              variant="h3"
              style="width: 50%"
            ></ea-skeleton-item>
            <div
              style="
                display: flex;
                align-items: center;
                justify-items: space-between;
                margin-top: 16px;
                height: 16px;
              "
            >
              <ea-skeleton-item
                variant="text"
                style="margin-right: 16px"
              ></ea-skeleton-item>
              <ea-skeleton-item
                variant="text"
                style="width: 30%"
              ></ea-skeleton-item>
            </div>
          </div>
        </div>
        <ea-card style="--ea-card-padding: 0">
          <ea-image
            src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
          ></ea-image>
          <div style="padding: 14px">
            <span>Wonderful scenery</span>
            <div
              style="
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span class="time">2025-10-20</span>
              <ea-button text class="button">Operation</ea-button>
            </div>
          </div>
        </ea-card>
      </ea-skeleton>
    </div>

    <script type="module">
      const loadingExample = {
        el: document.querySelector("#loadingSkeleton"),
        switch: document.querySelector("#loadingSwitch"),

        init() {
          this.switch.addEventListener("change", e => {
            const { value } = e.detail;

            this.el.loading = value;
          });
        },
      };

      loadingExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 渲染多条数据 --------  -->
    <!-- #region  -->
    <h2>渲染多条数据</h2>
    <div class="demo">
      <p>
        切换状态:
        <ea-switch
          id="multipleDataSwitch"
          style="width: 240px"
          value="true"
        ></ea-switch>
      </p>
      <ea-skeleton id="multipleDataSkeleton" animated count="2">
        <div slot="template">
          <ea-skeleton-item
            variant="image"
            style="width: 240px; height: 140px"
          ></ea-skeleton-item>
          <div style="padding: 14px">
            <ea-skeleton-item
              variant="text"
              style="width: 50%"
            ></ea-skeleton-item>
            <ea-skeleton-item
              variant="text"
              style="margin-right: 16px"
            ></ea-skeleton-item>
          </div>
        </div>
        <ea-card style="--ea-card-padding: 0">
          <ea-image
            src="https://tse1.mm.bing.net/th/id/OIP.rTMre-V-rMq3T1EP9W7vlAHaEK?cb=12&rs=1&pid=ImgDetMain&o=7&rm=3"
          ></ea-image>
          <div style="padding: 14px">
            <div>Scenery 1</div>
            <div style="font-size: 12px; color: gray">2025-10-20</div>
          </div>
        </ea-card>
        <ea-card style="--ea-card-padding: 0">
          <ea-image
            src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
          ></ea-image>
          <div style="padding: 14px">
            <div>Scenery 2</div>
            <div style="font-size: 12px; color: gray">2025-10-20</div>
          </div>
        </ea-card>
      </ea-skeleton>
    </div>

    <script type="module">
      const multipleDataExample = {
        el: document.querySelector("#multipleDataSkeleton"),
        switch: document.querySelector("#multipleDataSwitch"),

        init() {
          this.switch.addEventListener("change", e => {
            const { value } = e.detail;
            this.el.loading = value;
          });
        },
      };
      multipleDataExample.init();
    </script>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  切换显示/隐藏时避免渲染抖动 -->
    <!-- #region -->
    <h1>切换显示/隐藏时避免渲染抖动</h1>

    <div class="demo">
      <p>切换状态: <ea-switch id="throttleSwitch" value="true"></ea-switch></p>
      <ea-skeleton
        id="throttleSkeleton"
        style="width: 240px"
        animated
        throttle-trailing="500"
        throttle-leading="500"
      >
        <div slot="template">
          <ea-skeleton-item
            variant="image"
            style="width: 240px; height: 150px"
          ></ea-skeleton-item>
          <div style="padding: 14px">
            <ea-skeleton-item
              variant="h3"
              style="width: 50%"
            ></ea-skeleton-item>
            <div
              style="
                display: flex;
                align-items: center;
                justify-items: space-between;
                margin-top: 16px;
                height: 16px;
              "
            >
              <ea-skeleton-item
                variant="text"
                style="margin-right: 16px"
              ></ea-skeleton-item>
              <ea-skeleton-item
                variant="text"
                style="width: 30%"
              ></ea-skeleton-item>
            </div>
          </div>
        </div>
        <ea-card style="--ea-card-padding: 0">
          <ea-image
            src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
          ></ea-image>
          <div style="padding: 14px">
            <span>Wonderful scenery</span>
            <div
              style="
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
              "
            >
              <span class="time">2025-10-20</span>
              <ea-button text class="button">Operation</ea-button>
            </div>
          </div>
        </ea-card>
      </ea-skeleton>
    </div>

    <script type="module">
      const throttleExample = {
        el: document.querySelector("#throttleSkeleton"),
        switch: document.querySelector("#throttleSwitch"),

        init() {
          this.switch.addEventListener("change", e => {
            const { value } = e.detail;

            this.el.loading = value;
          });
        },
      };

      throttleExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
