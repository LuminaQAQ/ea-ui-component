<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transfer</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-transfer/index.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-transfer id="basicTransfer"></ea-transfer>
      <button id="setDataBtn">set data</button>
    </div>

    <script type="module">
      const basicExample = {
        transfer: document.querySelector("#basicTransfer"),
        setDataBtn: document.querySelector("#setDataBtn"),

        generateData: () => {
          const data = [];
          for (let i = 1; i <= 15; i++) {
            data.push({
              key: i,
              label: `Option ${i}`,
              disabled: i % 4 === 0,
            });
          }
          return data;
        },

        init() {
          const data = this.generateData();
          this.transfer.data = data;

          this.setDataBtn.addEventListener("click", () => {
            this.transfer.data = this.generateData();
          });

          this.transfer.addEventListener("change", e => {
            console.log(e.detail.value, this.transfer.value);
          });
        },
      };
      basicExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
