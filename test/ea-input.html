<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Document</title>
    <link rel='stylesheet' href='../dist/assets/icon.css'>

    <style>
        hr {
            margin: 3rem 0;
        }

        ea-input {
            margin: .5rem 0;
        }

        .demo-input-with-icon {
            width: 100%;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .label {
            display: block;
            margin-bottom: 1rem;
            color: var(--el-text-color-regular);
        }

        .input-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .responsive-input {
            width: 240px;
        }

        @media (max-width: 768px) {
            .input-container {
                flex-direction: column;
                gap: 1rem;
            }

            .responsive-input {
                width: 100%;
            }
        }

        /* .prepend,
        .append {
            height: 100%;
            padding: 0 0.5rem;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #f5f7fa;
        } */
    </style>
</head>

<body>

    <script type="module" src="../src/components/ea-input/index.js"></script>

    <!-- -------- 基础用法 --------  -->
    <!-- #region  -->
    <h2>基础用法</h2>
    <div class="row left">
        <ea-input style="width: 240px" placeholder="Please input"></ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 禁用状态 --------  -->
    <!-- #region  -->
    <h2>禁用状态</h2>
    <div class="row left">
        <ea-input style="width: 240px" disabled placeholder="Please input"></ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 可清空 --------  -->
    <!-- #region  -->
    <h2>可清空</h2>
    <div class="row left">
        <ea-input style="width: 240px" placeholder="Please input" clearable></ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 自定义清除图标 --------  -->
    <!-- #region  -->
    <h2>自定义清除图标</h2>
    <div class="row left">
        <ea-input style="width: 240px" placeholder="Please input" clearable
            clear-icon="icon-cancel-circled2"></ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 密码框 --------  -->
    <!-- #region  -->
    <h2>密码框</h2>
    <div class="row left">
        <ea-input style="width: 240px" type="password" placeholder="Please input password" show-password></ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 带 icon 的输入框 --------  -->
    <!-- #region  -->
    <h2>带 icon 的输入框</h2>
    <div class="row left">
    </div>
    <div class="demo-input-with-icon">
        <div class="input-group">
            <span class="label">Using attributes</span>
            <div class="input-container">
                <ea-input class="responsive-input" placeholder="Pick a date" prefix-icon="icon-coffee"></ea-input>
                <ea-input class="responsive-input" placeholder="Type something" suffix-icon="icon-coffee"></ea-input>
            </div>
        </div>
        <div class="input-group">
            <span class="label">Using slots</span>
            <div class="input-container">
                <ea-input v-model="input3" class="responsive-input" placeholder="Pick a date">
                    <ea-icon icon="icon-search" slot="suffix"></ea-icon>
                </ea-input>
                <ea-input v-model="input4" class="responsive-input" placeholder="Type something">
                    <ea-icon icon="icon-search" slot="prefix"></ea-icon>
                </ea-input>
            </div>
        </div>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- #region 文本域 -->
    <h1>文本域</h1>

    <div class="demo">
        <ea-input style="width: 240px" rows="4" type="textarea" placeholder="Please input"></ea-input>
    </div>

    <hr>
    <!-- #endregion  -->

    <!-- #region 自适应文本域 -->
    <h1>自适应文本域</h1>

    <div class="demo">
        <ea-input style="width: 240px" rows="4" type="textarea" placeholder="Please input" autosize></ea-input>
        <ea-input style="width: 240px" type="textarea" placeholder="Please input" autosize min-rows="2"
            max-rows="4"></ea-input>
    </div>

    <hr>
    <!-- #endregion  -->

    <!-- -------- 复合型输入框 --------  -->
    <!-- #region  -->
    <h2>复合型输入框</h2>
    <div class="col left">
        <ea-input style="max-width: 600px" placeholder="Please input">
            <div class="prepend" slot="prepend">Http://</div>
        </ea-input>
        <ea-input style="max-width: 600px" placeholder="Please input">
            <div class="append" slot="append">.com</div>
        </ea-input>
        <ea-input style="max-width: 600px" placeholder="Please input">
            <div class="prepend" slot="prepend">Http://</div>
            <div class="append" slot="append">
                <i class="icon-search"></i>
            </div>
        </ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 输入长度限制 --------  -->
    <!-- #region  -->
    <h2>输入长度限制</h2>
    <div class="col left">
        <ea-input placeholder="请输入内容" show-word-limit maxlength="10"></ea-input>
        <ea-input placeholder="请输入内容" show-word-limit minlength="2"></ea-input>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <script type='module'>
        // ------- 带输入建议 -------
        // #region
        const suggestion = {
            input: document.querySelector('#trigger-on-focus'),
            afterInput: document.querySelector('#trigger-after-input'),
            remote: document.querySelector('#trigger-on-focus_for-remote'),
            data: [{ value: "123" }, { value: "456" }, { value: "789" }],

            handleRemoteSearch(data) {
                this.remote.remote = true;
                setTimeout(() => {
                    this.remote.suggestion = data;
                    this.remote.remote = false;
                }, 3 * 1000);
            },

            init() {
                this.input.suggestion = [{ value: "1" }, { value: "2" }];
                this.afterInput.suggestion = [{ value: "456" }, { value: "789" }];

                this.remote.addEventListener('change', (e) => {
                    this.handleRemoteSearch(this.data.filter(item => item.value.includes(e.detail.value)));
                });

                this.remote.addEventListener('focus', (e) => {
                    this.handleRemoteSearch(this.data);
                });
            }
        }
        suggestion.init();
        // #endregion
        // ------- end -------
    </script>
</body>

</html>
