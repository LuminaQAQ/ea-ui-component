<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }

      ea-input {
        margin: 0.5rem 0;
      }

      .prepend,
      .append {
        box-sizing: border-box;
        padding: 0.5rem;
        line-height: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f5f7fa;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-input/index.ts"></script>
    <script type="module" src="../src/components/ea-button/index.ts"></script>

    <!-- -------- 基础用法 --------  -->
    <!-- #region  -->
    <h2>基础用法</h2>
    <div class="demo">
      <ea-input style="width: 240px" placeholder="Please input"></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 标签 --------  -->
    <!-- #region  -->
    <h2>标签</h2>
    <div class="demo">
      <ea-input style="width: 240px" label="用户名" placeholder="Please input"></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 禁用状态 --------  -->
    <!-- #region  -->
    <h2>禁用状态</h2>
    <div class="demo">
      <ea-input
        style="width: 240px"
        disabled
        placeholder="Please input"
      ></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 可清空 --------  -->
    <!-- #region  -->
    <h2>可清空</h2>
    <div class="demo">
      <ea-input
        style="width: 240px"
        placeholder="Please input"
        clearable
      ></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 自定义清除图标 --------  -->
    <!-- #region  -->
    <h2>自定义清除图标</h2>
    <div class="demo">
      <ea-input
        style="width: 240px"
        placeholder="Please input"
        clearable
        clear-icon="circle-xmark"
      ></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 密码框 --------  -->
    <!-- #region  -->
    <h2>密码框</h2>
    <div class="demo">
      <ea-input
        style="width: 240px"
        type="password"
        placeholder="Please input password"
        show-password
      ></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 带 icon 的输入框 --------  -->
    <!-- #region  -->
    <h2>带 icon 的输入框</h2>
    <div class="demo demo-input-with-icon">
      <div class="input-group">
        <p class="label">Using attributes</p>
        <div class="input-container">
          <ea-input
            class="responsive-input"
            placeholder="Pick a date"
            prefix-icon="mug-hot"
          ></ea-input>
          <ea-input
            class="responsive-input"
            placeholder="Type something"
            suffix-icon="mug-hot"
          ></ea-input>
        </div>
      </div>
      <div class="input-group">
        <p class="label">Using slots</p>
        <div class="input-container">
          <ea-input class="responsive-input" placeholder="Pick a date">
            <ea-icon name="magnifying-glass" slot="suffix"></ea-icon>
          </ea-input>
          <ea-input class="responsive-input" placeholder="Type something">
            <ea-icon name="magnifying-glass" slot="prefix"></ea-icon>
          </ea-input>
        </div>
      </div>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- #region 文本域 -->
    <h1>文本域</h1>

    <div class="demo">
      <ea-input
        style="width: 240px"
        rows="4"
        type="textarea"
        placeholder="Please input"
      ></ea-input>
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- #region 自适应文本域 -->
    <h1>自适应文本域</h1>

    <div class="demo">
      <ea-input
        style="width: 240px"
        rows="4"
        type="textarea"
        placeholder="Please input"
        autosize
      ></ea-input>
      <ea-input
        style="width: 240px"
        type="textarea"
        placeholder="Please input"
        autosize
        min-rows="2"
        max-rows="4"
      ></ea-input>
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- -------- 复合型输入框 --------  -->
    <!-- #region  -->
    <h2>复合型输入框</h2>
    <div class="demo">
      <ea-input style="max-width: 600px" placeholder="Please input">
        <div class="prepend" slot="prepend">Http://</div>
      </ea-input>
      <ea-input style="max-width: 600px" placeholder="Please input">
        <div class="append" slot="append">.com</div>
      </ea-input>
      <ea-input style="max-width: 600px" placeholder="Please input">
        <div class="prepend" slot="prepend">Http://</div>
        <div class="append" slot="append">
          <ea-icon name="magnifying-glass"></ea-icon>
        </div>
      </ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- #region 尺寸 -->
    <h1>尺寸</h1>

    <div class="demo">
      <ea-input
        style="width: 240px"
        size="large"
        placeholder="Please Input"
      ></ea-input>
      <ea-input style="width: 240px" placeholder="Please Input"></ea-input>
      <ea-input
        style="width: 240px"
        size="small"
        placeholder="Please Input"
      ></ea-input>
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- -------- 输入长度限制 --------  -->
    <!-- #region  -->
    <h2>输入长度限制</h2>
    <div class="col left">
      <ea-input
        style="width: 240px"
        maxlength="10"
        placeholder="Please input"
        show-word-limit
        type="text"
        clearable
      ></ea-input>
      <ea-input
        maxlength="30"
        style="width: 240px"
        placeholder="Please input"
        show-word-limit
        type="textarea"
        clearable
      ></ea-input>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
