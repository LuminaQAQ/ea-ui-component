<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-result/index.ts"></script>
    <script type="module" src="../src/components/ea-button/index.ts"></script>
    <script type="module" src="../src/components/ea-image/index.ts"></script>

    <!-- -------- 基础用法 --------  -->
    <!-- #region  -->
    <h2>基础用法</h2>
    <div class="row space-between">
      <ea-result
        variant="primary"
        heading="Primary Tip"
        sub-title="Please follow the instructions"
      >
        <div slot="extra">
          <ea-button variant="primary">Back</ea-button>
        </div>
      </ea-result>
      <ea-result
        variant="success"
        heading="Success Tip"
        sub-title="Please follow the instructions"
      >
        <div slot="extra">
          <ea-button variant="primary">Back</ea-button>
        </div>
      </ea-result>
      <ea-result
        variant="warning"
        heading="Warning Tip"
        sub-title="Please follow the instructions"
      >
        <div slot="extra">
          <ea-button variant="primary">Back</ea-button>
        </div>
      </ea-result>
      <ea-result
        variant="error"
        heading="Error Tip"
        sub-title="Please follow the instructions"
      >
        <div slot="extra">
          <ea-button variant="primary">Back</ea-button>
        </div>
      </ea-result>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  自定义内容  -->
    <!-- #region -->
    <h1>自定义内容</h1>

    <div class="demo">
      <ea-result heading="404" sub-title="Sorry, request error">
        <div slot="icon">
          <ea-image
            src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
          ></ea-image>
        </div>
        <div slot="extra">
          <ea-button variant="primary">Back</ea-button>
        </div>
      </ea-result>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
