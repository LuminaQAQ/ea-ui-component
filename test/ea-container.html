<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    
    <style>
      .row { margin: 1rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }

      html,
      body {
        margin: 0;
        padding: 0;

        height: 100%;
        width: 100%;
      }

      ea-header::part(container),
      ea-main::part(container),
      ea-footer::part(container),
      ea-aside::part(container) {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      ea-header::part(container) {
        text-align: center;
        background-color: #b3c0d1;
      }

      ea-main::part(container) {
        text-align: center;
        background-color: #e9eef3;
      }

      ea-footer::part(container) {
        text-align: center;
        background-color: #b3c0d1;
      }

      ea-aside::part(container) {
        background-color: #d3dce6;
        text-align: center;
      }

      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }
    </style>
  </head>

  <body>
    <script type="module" src="/src/components/ea-container/index.ts"></script>

    <div class="demo">
      <ea-container style="height: 500px">
        <ea-header>Header</ea-header>
        <ea-main>Main</ea-main>
      </ea-container>
    </div>

    <hr />

    <div class="demo">
      <ea-container style="height: 500px">
        <ea-header>Header</ea-header>
        <ea-main>Main</ea-main>
        <ea-footer>Footer</ea-footer>
      </ea-container>
    </div>

    <hr />

    <div class="demo">
      <ea-container style="height: 500px" direction="horizontal">
        <ea-aside width="150px">Aside</ea-aside>
        <ea-main>Main</ea-main>
        <ea-aside width="150px">Aside</ea-aside>
      </ea-container>
    </div>

    <hr />

    <div class="demo">
      <ea-container style="height: 500px">
        <ea-header>Header</ea-header>
        <ea-container direction="horizontal">
          <ea-aside width="200px">Aside</ea-aside>
          <ea-main>Main</ea-main>
        </ea-container>
      </ea-container>
    </div>

    <hr />

    <div class="demo">
      <ea-container style="height: 500px">
        <ea-header>Header</ea-header>
        <ea-container direction="horizontal">
          <ea-aside width="200px">Aside</ea-aside>
          <ea-container>
            <ea-main>Main</ea-main>
            <ea-footer>Footer</ea-footer>
          </ea-container>
        </ea-container>
      </ea-container>
    </div>

    <hr />

    <div class="demo">
      <ea-container style="height: 500px" direction="horizontal">
        <ea-aside width="200px">Aside</ea-aside>
        <ea-container>
          <ea-header>Header</ea-header>
          <ea-main>Main</ea-main>
        </ea-container>
      </ea-container>
    </div>

    <hr />

    <div class="demo">
      <ea-container style="height: 500px" direction="horizontal">
        <ea-aside width="200px">Aside</ea-aside>
        <ea-container>
          <ea-header>Header</ea-header>
          <ea-main>Main</ea-main>
          <ea-footer>Footer</ea-footer>
        </ea-container>
      </ea-container>
    </div>
  </body>
</html>
