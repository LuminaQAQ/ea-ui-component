<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>dialog</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
        hr {
            margin: 3rem 0;
        }
    </style>
</head>

<body>

    <script type="module" src="../src/components/ea-dialog/index.js"></script>
    <script type="module" src="../src/components/ea-button/index.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
        <ea-dialog title="Tips" width="500px">
            <span>This is a message</span>
            <section slot="footer">
                <div class="dialog-footer">
                    <ea-button @click="dialogVisible = false">Cancel</ea-button>
                    <ea-button type="primary" @click="dialogVisible = false">
                        Confirm
                    </ea-button>
                </div>
            </section>
        </ea-dialog>
    </div>

    <hr>
    <!-- #endregion  -->
    <!-- end  -->
</body>

</html>
