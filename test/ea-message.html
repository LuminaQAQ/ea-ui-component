<body>

    <script type="module" src="../src/components/ea-button/index.js"></script>

    <script type="module">
        import { EaMessage } from "../src/components/ea-message/index.js";

        // ------- 基础用法 -------
        // #region
        const basicExample = {
            moduleInstanceBtn: document.getElementById("moduleInstanceBtn"),
            chainInstanceBtn: document.getElementById("chainInstanceBtn"),

            init() {
                this.moduleInstanceBtn.addEventListener("click", () => {
                    EaMessage({
                        message: "This is a message.",
                        type: "info",
                        showClose: false,
                        duration: 3000,
                    });
                });

                this.chainInstanceBtn.addEventListener("click", () => {
                    EaMessage.info('This is a message.');
                });
            }
        }
        basicExample.init();
        // #endregion
        // ------- end -------
    </script>

    <!-- #region 基础用法 -->
    <h1>基础用法</h1>

    <div class="demo">
        <ea-button plain onclick='window.$message({
            message: "This is a message.",
            type: "info",
            showClose: false,
            duration: 3000,
        })'>
            Show message
        </ea-button>
        <ea-button id="moduleInstanceBtn" plain>
            Module-Instance message
        </ea-button>
        <ea-button id="chainInstanceBtn" plain>
            Chain-Instance message
        </ea-button>
    </div>

    <hr>
    <!-- #endregion  -->

    <!-- -------- 不同状态 --------  -->
    <!-- #region  -->
    <h2>不同状态</h2>
    <div class="demo">
        <ea-button plain onclick="window.$message.info('This is a info message.')">info</ea-button>
        <ea-button type="primary" plain onclick="window.$message.primary('This is a info message.')">Primary</ea-button>
        <ea-button type="success" plain
            onclick="window.$message.success('Congrats, this is a success message.')">Success</ea-button>
        <ea-button type="warning" plain
            onclick="window.$message.warning('Warning, this is a warning message.')">Warning</ea-button>
        <ea-button type="danger" plain
            onclick="window.$message.error('Oops, this is a error message.')">Error</ea-button>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 可关闭 --------  -->
    <!-- #region  -->
    <h2>可关闭</h2>
    <div class="demo">
        <ea-button plain
            onclick="window.$message({ message: 'This is a info message.', showClose: true })">info</ea-button>
        <ea-button type="primary" plain
            onclick="window.$message({ type: 'primary', message: 'This is a info message.', showClose: true })">Primary</ea-button>
        <ea-button type="success" plain
            onclick="window.$message({ type: 'success', message: 'Congrats, this is a success message.', showClose: true })">Success</ea-button>
        <ea-button type="warning" plain
            onclick="window.$message({ type: 'warning', message: 'Warning, this is a warning message.', showClose: true })">Warning</ea-button>
        <ea-button type="danger" plain
            onclick="window.$message({ type: 'danger', message: 'Oops, this is a error message.', showClose: true })">Error</ea-button>
    </div>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 文字居中 --------  -->
    <!-- #region  -->
    <h2>文字居中</h2><ea-button
        onclick='$message.open({ text: "对象类消息提示(info)", center: true, duration: 0})'>文字居中</ea-button>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- close 事件 --------  -->
    <!-- #region  -->
    <h2>close 事件</h2>
    <ea-button id="closeEventBtn">close 事件</ea-button>
    <hr>
    <!-- #endregion  -->
    <!-- -------------------  -->
</body>

</html>
