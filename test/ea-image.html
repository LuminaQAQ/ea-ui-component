<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../components/ea-icon/index.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-image/index.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-image
        fit="fill"
        width="100px"
        height="100px"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="contain"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="cover"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="none"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="scale-down"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  占位内容 -->
    <!-- #region -->
    <h1>占位内容</h1>

    <style>
      .image-slot {
        margin: auto;
      }
    </style>
    <div class="demo">
      <ea-image
        class="image"
        width="100px"
        height="100px"
        fit="cover"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      >
        <div class="image-slot" slot="placeholder">
          Loading<span class="dot">...</span>
        </div>
      </ea-image>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 加载失败 --------  -->
    <!-- #region  -->
    <h2>加载失败</h2>
    <div class="row">
      <ea-image src="1111" fit="fill"></ea-image>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 懒加载 --------  -->
    <!-- #region  -->
    <h2>懒加载</h2>
    <div class="row">
      <ea-image
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
        lazy
      ></ea-image>
    </div>

    <div class="demo" style="height: 120px; overflow: auto">
      <ea-image
        src="https://fuss10.elemecdn.com/a/3f/3302e58f9a181d2509f3dc0fa68b0jpeg.jpeg"
        lazy
      ></ea-image>
      <ea-image
        src="https://fuss10.elemecdn.com/1/34/19aa98b1fcb2781c4fba33d850549jpeg.jpeg"
        lazy
      ></ea-image>
      <ea-image
        src="https://fuss10.elemecdn.com/0/6f/e35ff375812e6b0020b6b4e8f9583jpeg.jpeg"
        lazy
      ></ea-image>
      <ea-image
        src="https://fuss10.elemecdn.com/9/bb/e27858e973f5d7d3904835f46abbdjpeg.jpeg"
        lazy
      ></ea-image>
      <ea-image
        src="https://fuss10.elemecdn.com/d/e6/c4d93a3805b3ce3f323f7974e6f78jpeg.jpeg"
        lazy
      ></ea-image>
      <ea-image
        src="https://fuss10.elemecdn.com/3/28/bbf893f792f03a54408b3b7a7ebf0jpeg.jpeg"
        lazy
      ></ea-image>
      <ea-image
        src="https://fuss10.elemecdn.com/2/11/6535bcfb26e4c79b48ddde44f4b6fjpeg.jpeg"
        lazy
      ></ea-image>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 大图预览 --------  -->
    <!-- #region  -->
    <h2>大图预览</h2>
    <div class="row">
      <ea-image
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
        lazy
        preview
      >
        <div slot="placeholder">加载中...</div>
      </ea-image>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
