<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-image/index.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-image
        fit="fill"
        width="100px"
        height="100px"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="contain"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="cover"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="none"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
      <ea-image
        width="100px"
        height="100px"
        fit="scale-down"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      ></ea-image>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  占位内容 -->
    <!-- #region -->
    <h1>占位内容</h1>

    <style>
      .image-slot {
        margin: auto;
      }
    </style>
    <div class="demo">
      <ea-image
        class="image"
        width="200px"
        height="150px"
        fit="cover"
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
      >
        <div class="image-slot" slot="placeholder">
          Loading<span class="dot">...</span>
        </div>
      </ea-image>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  加载失败 -->
    <!-- #region -->
    <h1>加载失败</h1>

    <style>
      .error ea-image {
        width: 150px;
        height: 200px;
      }
    </style>

    <div class="demo error">
      <ea-image></ea-image>
      <ea-image>
        <ea-icon slot="error" icon="icon-picture" size="30"></ea-icon>
      </ea-image>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 懒加载 --------  -->
    <!-- #region  -->
    <h2>懒加载</h2>
    <style>
      .lazy {
        height: 200px;
        width: 500px;
        overflow: auto;
      }

      .lazy ea-image {
        height: 200px;
        width: 100%;
      }
    </style>

    <div class="demo">
      <ea-image
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
        lazy
      ></ea-image>
    </div>

    <div class="demo lazy">
      <ea-image
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
        lazy
      ></ea-image>
      <ea-image
        src="https://th.bing.com/th/id/R.d88442788ee5a458d50e40f0a8cb1e05?rik=EoPp8GhejYeQfw&riu=http%3a%2f%2fimg.pconline.com.cn%2fimages%2fupload%2fupc%2ftx%2fwallpaper%2f1307%2f10%2fc2%2f23151595_1373424485102.jpg&ehk=J7xq%2f50bCmdD4jUXfnTlau2s5WiVsBxQArAjvJzqIo4%3d&risl=&pid=ImgRaw&r=0"
        lazy
      ></ea-image>
      <ea-image
        src="https://www.keaitupian.cn/cjpic/frombd/0/253/4061721412/2857814056.jpg"
        lazy
      ></ea-image>
      <ea-image
        src="https://www.keaitupian.cn/cjpic/frombd/2/253/2107631312/3178897554.jpg"
        lazy
      ></ea-image>
      <ea-image
        src="https://img95.699pic.com/photo/40243/5928.jpg_wh860.jpg"
        lazy
      ></ea-image>
      <ea-image
        src="https://tse1.mm.bing.net/th/id/OIP.VS7qtQiQgNuBk2SVdwvxagHaEk?rs=1&pid=ImgDetMain&o=7&rm=3"
        lazy
      ></ea-image>
      <ea-image
        src="https://www.keaitupian.cn/cjpic/frombd/1/253/2032688566/3458490751.jpg"
        lazy
      ></ea-image>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  图片预览 -->
    <!-- #region -->
    <h1>图片预览</h1>

    <div class="demo">
      <ea-image
        src="https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain"
        preview
      >
      </ea-image>

      <ea-image-preview
        visible="true"
        url-list='[
          "1https://tse2-mm.cn.bing.net/th/id/OIP-C.mH9YLFEL5YdVxJM82mjVJQAAAA?rs=1&pid=ImgDetMain",
          "https://th.bing.com/th/id/R.d88442788ee5a458d50e40f0a8cb1e05?rik=EoPp8GhejYeQfw&riu=http%3a%2f%2fimg.pconline.com.cn%2fimages%2fupload%2fupc%2ftx%2fwallpaper%2f1307%2f10%2fc2%2f23151595_1373424485102.jpg&ehk=J7xq%2f50bCmdD4jUXfnTlau2s5WiVsBxQArAjvJzqIo4%3d&risl=&pid=ImgRaw&r=0",
          "https://www.keaitupian.cn/cjpic/frombd/0/253/4061721412/2857814056.jpg",
          "https://www.keaitupian.cn/cjpic/frombd/2/253/2107631312/3178897554.jpg",
          "https://img95.699pic.com/photo/40243/5928.jpg_wh860.jpg",
          "https://tse1.mm.bing.net/th/id/OIP.VS7qtQiQgNuBk2SVdwvxagHaEk?rs=1&pid=ImgDetMain&o=7&rm=3",
          "https://www.keaitupian.cn/cjpic/frombd/1/253/2032688566/3458490751.jpg"
        ]'
      >
        <section slot="viewer-error">viewer-error</section>
        <section slot="toolbar">toolbar</section>
        <section slot="progress">progress</section>
      </ea-image-preview>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
