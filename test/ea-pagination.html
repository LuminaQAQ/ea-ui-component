<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-pagination/index.js"
    ></script>
    <script type="module">
      //   document
      //     .querySelector("#prevAndNext")
      //     .addEventListener("change", function (e) {
      //       alert(`当前页码为: ${e.detail.currentPage}`);
      //     });
    </script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-pagination
        layout='["prev", "pager", "next"]'
        total="50"
      ></ea-pagination>
      <ea-pagination
        layout='["prev", "pager", "next"]'
        total="1000"
      ></ea-pagination>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 设置最大页码按钮数 --------  -->
    <!-- #region  -->
    <h2>设置最大页码按钮数</h2>
    <div class="col left">
      <ea-pagination
        layout='["prev", "pager", "next"]'
        total="60"
        page-count="10"
      ></ea-pagination>
      <ea-pagination
        layout='["prev", "pager", "next"]'
        total="200"
        page-count="10"
      ></ea-pagination>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 带有背景色的分页 --------  -->
    <!-- #region  -->
    <h2>带有背景色的分页</h2>
    <div class="col left">
      <ea-pagination
        background
        layout='["prev", "pager", "next"]'
        total="200"
      ></ea-pagination>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 附加功能 --------  -->
    <!-- #region  -->
    <h2>附加功能</h2>
    <div class="col left">
      <section>显示总数</section>
      <ea-pagination
        background
        layout='["prev", "pager", "next", "total"]'
        total="200"
      ></ea-pagination>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
