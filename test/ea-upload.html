    <div class="demo">
      <ea-upload
        id="basicUpload"
        class="upload-demo"
        action="https://m1.apifoxmock.com/m1/8609267-8388194-default/file"
        multiple
      >
        <ea-button type="primary">Click to upload</ea-button>
        <div class="tip" slot="tip">
          jpg/png files with a size less than 500KB.
        </div>
      </ea-upload>
    </div>

    <script type="module">
      const basicUpload = document.getElementById("basicUpload");
      basicUpload.defaultFileList = [
        {
          uid: "1",
          name: "test.txt",
          status: "uploading",
          url: "http://example.com/test.txt",
          percent: 33,
        },
        {
          uid: "2",
          name: "test.txt",
          status: "done",
          url: "http://example.com/test.txt",
        },
        {
          uid: "3",
          name: "test.txt",
          status: "error",
          response: "404 Not Found",
          url: "http://example.com/test.txt",
        },
      ];

      basicUpload.addEventListener("change", e => {
        console.log(e, e.detail, e.target.fileList);
      });
      basicUpload.onRemove = (file, fileList) => {
        console.log(file, fileList);
      };
      basicUpload.beforeRemove = (file, fileList) => {
        return window.$confirm(`Cancel the transfer of ${file.name} ?`);
      };
    </script>

    <div class="demo-section">
      <h3>事件监听示例</h3>
      <ea-upload
        id="eventUpload"
        url="http://localhost:3100/api/upload/single"
      ></ea-upload>
      <div
        id="eventLog"
        style="
          margin-top: 1rem;
          padding: 1rem;
          background: #f5f5f5;
          border-radius: 4px;
          font-size: 12px;
          max-height: 200px;
          overflow-y: auto;
        "
      ></div>
    </div>

    <script>
      const eventUpload = document.getElementById("eventUpload");
      const eventLog = document.getElementById("eventLog");

      function logEvent(eventName, detail) {
        const div = document.createElement("div");
        div.style.marginBottom = "4px";
        div.innerHTML = `<strong>${eventName}:</strong> ${JSON.stringify(detail, null, 2)}`;
        eventLog.appendChild(div);
        eventLog.scrollTop = eventLog.scrollHeight;
      }

      eventUpload.addEventListener("ea-change", e => {
        logEvent("ea-change", e.detail);
      });

      eventUpload.addEventListener("ea-progress", e => {
        logEvent("ea-progress", {
          percentage: e.detail.percentage,
          fileName: e.detail.file.name,
        });
      });

      eventUpload.addEventListener("ea-success", e => {
        logEvent("ea-success", {
          fileName: e.detail.file.name,
          response: e.detail.response,
        });
      });

      eventUpload.addEventListener("ea-error", e => {
        logEvent("ea-error", e.detail);
      });
    </script>
