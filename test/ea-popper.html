<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Document</title>
    <link rel='stylesheet' href='../dist/assets/icon.css'>

    <style>
        hr {
            margin: 3rem 0;
        }

        ea-popper {
            /* width: 5rem; */
            margin: .75rem;
        }
    </style>
</head>

<body>

    <script src="../src/components/ea-button/index.js" type='module'></script>
    <script src="../src/components/ea-card/index.js" type='module'></script>
    <script src="../src/common/ea-popper/index.js" type='module'></script>

    <!-- #region 基础用法 -->
    <h1>基础用法</h1>

    <div class=‘demo’>
        <ea-popper>top</ea-popper>
        <ea-popper placement="top-start">top-start</ea-popper>
        <ea-popper placement="top-end">top-end</ea-popper>

        <br>

        <ea-popper placement="bottom">bottom</ea-popper>
        <ea-popper placement="bottom-start">bottom-start</ea-popper>
        <ea-popper placement="bottom-end">bottom-end</ea-popper>

        <br>

        <ea-popper placement="left">left <br> &emsp;</ea-popper>
        <ea-popper placement="left-start">left-<br> start</ea-popper>
        <ea-popper placement="left-end">left- <br> end </ea-popper>

        <br>

        <ea-popper placement="right">right <br> &emsp;</ea-popper>
        <ea-popper placement="right-start">right-<br> start</ea-popper>
        <ea-popper placement="right-end">right- <br> end </ea-popper>
    </div>

    <hr>
    <!-- #endregion  -->

    <!-- #region 展示箭头 -->
    <h1>展示箭头</h1>

    <div class=‘demo’>
        <ea-popper show-arrow="false">top</ea-popper>
        <ea-popper show-arrow="false" placement="top-start">top-start</ea-popper>
        <ea-popper show-arrow="false" placement="top-end">top-end</ea-popper>
    </div>

    <hr>
    <!-- #endregion  -->

    <!-- #region 参考元素 -->
    <h1>参考元素</h1>

    <div class=‘demo’>
        <ea-popper>top</ea-popper>
        <ea-popper placement="top-start">
            top-start
            <ea-button slot="reference">top-start</ea-button>
        </ea-popper>
        <ea-popper placement="top-end">top-end</ea-popper>

        <br>

        <ea-popper placement="bottom">bottom</ea-popper>
        <ea-popper placement="bottom-start">bottom-start</ea-popper>
        <ea-popper placement="bottom-end">bottom-end</ea-popper>

        <br>

        <ea-popper placement="left">left <br> &emsp;</ea-popper>
        <ea-popper placement="left-start">left-<br> start</ea-popper>
        <ea-popper placement="left-end">left- <br> end </ea-popper>

        <br>

        <ea-popper placement="right">right <br> &emsp;</ea-popper>
        <ea-popper placement="right-start">right-<br> start</ea-popper>
        <ea-popper placement="right-end">right- <br> end </ea-popper>
    </div>

    <hr>
    <!-- #endregion  -->

    <script>
    </script>
</body>

</html>
