<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    
    <style>
      hr {
        margin: 2rem 0;
        border: none;
        border-top: 1px solid var(--grey-200, #e4e7ed);
      }

      .row {
        margin: 1rem 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-rate/index.ts"></script>

    <!-- -------- 基础用法 -------- -->
    <!-- #region  -->
    <h2>基础用法</h2>
    <div class="row">
      <section>
        <p>Default</p>
        <ea-rate></ea-rate>
      </section>
      <section>
        <p>Custom color</p>
        <ea-rate style="--ea-rate-active-color: red"></ea-rate>
      </section>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  尺寸 -->
    <!-- #region -->
    <h2>尺寸</h2>

    <div class="demo">
      <ea-rate size="large"></ea-rate>
      <br />
      <ea-rate></ea-rate>
      <br />
      <ea-rate size="small"></ea-rate>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 只读 -------- -->
    <!-- #region  -->
    <h2>只读</h2>
    <div class="demo">
      <ea-rate value="2" readonly></ea-rate>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 禁用状态 -------- -->
    <!-- #region  -->
    <h2>禁用状态</h2>
    <div class="demo">
      <ea-rate value="2" disabled></ea-rate>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 最大值 -------- -->
    <!-- #region  -->
    <h2>最大值</h2>
    <div class="demo">
      <ea-rate max="3"></ea-rate>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 辅助文字 -------- -->
    <!-- #region  -->
    <h2>辅助文字</h2>

    <style>
      .hover-rate-text {
        position: absolute;

        display: inline-block;
        box-sizing: border-box;

        padding: 4px 6px;

        border-radius: 8px;
        background: black;
        color: white;
        text-align: center;
      }

      .hover-rate-text:empty {
        display: none;
      }
    </style>

    <div class="row">
      <section style="position: relative">
        <ea-rate id="hoverRate"></ea-rate>
        <span class="hover-rate-text"></span>
      </section>
    </div>

    <script type="module">
      const hoverExample = {
        rate: document.querySelector("#hoverRate"),
        content: document.querySelector(".hover-rate-text"),

        text: ["oops", "disappointed", "normal", "good", "great"],

        init() {
          this.rate.addEventListener("ea-hover", e => {
            this.content.textContent = this.text[e.detail.value];
          });
        },
      };

      hoverExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 自定义图标 -------- -->
    <!-- #region  -->
    <h2>自定义图标</h2>

    <div class="demo">
      <ea-rate
        id="customIconRate"
        value="2"
        style="--ea-rate-active-color: red"
      ></ea-rate>
    </div>

    <script type="module">
      const customIconExample = {
        rate: document.querySelector("#customIconRate"),

        init() {
          this.rate.getSymbol = () =>
            `<ea-icon name="heart" part="icon"></ea-icon>`;
        },
      };
      customIconExample.init();
    </script>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 自定义图标渲染 -------- -->
    <!-- #region  -->
    <h2>自定义图标渲染</h2>
    <div class="demo">
      <ea-rate
        id="customIconRendererRate"
        style="--ea-rate-spacing: 4px"
      ></ea-rate>
    </div>

    <script type="module">
      const customIconRendererExample = {
        rate: document.querySelector("#customIconRendererRate"),
        color: ["red", "orange", "yellow", "green", "blue"],

        init() {
          const batteryIcons = [
            "battery-empty",
            "battery-quarter",
            "battery-half",
            "battery-three-quarters",
            "battery-full",
          ];
          this.rate.getSymbol = (value, isSelected) =>
            `<ea-icon name="${batteryIcons[value]}" part="icon"></ea-icon>`;

          this.rate.addEventListener("ea-hover", e => {
            this.rate.style.setProperty(
              "--ea-rate-active-color",
              this.color[e.detail.value]
            );
          });
        },
      };

      customIconRendererExample.init();
    </script>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
