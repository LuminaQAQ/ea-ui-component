<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    
    <style>
      .row { margin: 1rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-button/index.ts"></script>

    <script type="module">
      import { EaNotification } from "../src/components/ea-notification/index.ts";

      // ------- 基础用法 -------
      // #region
      const basicExample = {
        moduleInstanceBtn: document.getElementById("moduleInstanceBtn"),

        init() {
          this.moduleInstanceBtn.addEventListener("click", () => {
            EaNotification({
              heading: "Title",
              message: "This is a message that automatically close",
            });
          });
        },
      };
      basicExample.init();
      // #endregion
      // ------- end -------

      // ------- 自定义位置 -------
      // #region
      const placementExample = {
        btns: document.querySelectorAll("#placementSection ea-button"),

        init() {
          this.btns.forEach(btn => {
            btn.addEventListener("click", () => {
              EaNotification({
                heading: "Custom Position",
                message: "This is a message",
                placement: btn.textContent
                  .trim()
                  .toLowerCase()
                  .replace(" ", "-"),
              });
            });
          });
        },
      };
      placementExample.init();
      // #endregion
      // ------- end -------
    </script>

    <!-- #region 基础用法 -->
    <h2>基础用法</h2>

    <div class="demo">
      <ea-button
        plain
        onclick="
          window.$notify({
            heading: 'Title',
            message: 'This is a message that automatically close',
          })
        "
      >
        Closes automatically
      </ea-button>
      <ea-button
        plain
        onclick="
          window.$notify({
            heading: 'Prompt',
            message: 'This is a message that does not automatically close',
            duration: 0,
          })
        "
      >
        Won't close automatically
      </ea-button>
      <ea-button id="moduleInstanceBtn" plain>
        Module-Instance notify
      </ea-button>
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- -------- 不同类型 --------  -->
    <!-- #region  -->
    <h2>不同类型</h2>
    <div id="typeSection" class="demo">
      <ea-button
        plain
        onclick="
          window.$notify.info({
            heading: 'Info',
            message: 'This is a info message.',
          })
        "
        >Info</ea-button
      >
      <ea-button
        variant="primary"
        plain
        onclick="
          window.$notify.primary({
            heading: 'Primary',
            message: 'This is a primary message.',
          })
        "
        >Primary</ea-button
      >
      <ea-button
        variant="success"
        plain
        onclick="
          window.$notify.success({
            heading: 'Success',
            message: 'Congrats, this is a success message.',
          })
        "
        >Success</ea-button
      >
      <ea-button
        variant="warning"
        plain
        onclick="
          window.$notify.warning({
            heading: 'Warning',
            message: 'Warning, this is a warning message.',
          })
        "
        >Warning</ea-button
      >
      <ea-button
        variant="danger"
        plain
        onclick="
          window.$notify.error({
            heading: 'Error',
            message: 'Oops, this is a error message.',
          })
        "
        >Error</ea-button
      >
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 自定义位置 --------  -->
    <!-- #region  -->
    <h2>自定义位置</h2>
    <div id="placementSection" class="demo">
      <ea-button plain> Top Right </ea-button>
      <ea-button plain> Bottom Right </ea-button>
      <ea-button plain> Bottom Left </ea-button>
      <ea-button plain> Top Left </ea-button>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 使用 HTML 片段作为正文内容 --------  -->
    <!-- #region  -->
    <h2>使用 HTML 片段作为正文内容</h2>
    <div class="demo" id="useHTMLSection">
      <ea-button
        plain
        onclick="
          window.$notify({
            heading: 'HTML String',
            dangerouslyUseHTMLString: true,
            message: '<strong>This is <i>HTML</i> string</strong>',
          })
        "
      >
        Use HTML string
      </ea-button>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 隐藏关闭按钮 --------  -->
    <!-- #region  -->
    <h2>隐藏关闭按钮</h2>
    <div class="demo">
      <ea-button
        plain
        onclick="
          window.$notify({
            heading: 'Info',
            message: 'This is a message without close button',
            showClose: false,
          })
        "
      >
        Hide close button
      </ea-button>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
