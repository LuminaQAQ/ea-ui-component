<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .row { margin: 1rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }

      .demo-date-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        padding: 1rem 0;
      }

      .demo-date-picker .block {
        flex: 1;
        min-width: 240px;
        max-width: 320px;
        padding: 1.5rem;
      }

      .demo-date-picker .demonstration {
        display: block;
        margin-bottom: 0.75rem;
        font-size: 14px;
        text-align: center;
        color: #606266;
      }

      .demo-date-picker .demonstration:first-child {
        font-weight: 600;
        color: #303133;
      }

      .demo-date-picker ea-date-picker {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-date-picker/index.ts"
    ></script>
    <script
      type="module"
      src="../src/components/ea-segmented/index.ts"
    ></script>

    <!-- 选择某一天  -->
    <!-- #region -->
    <h2>选择某一天</h2>

    <div class="demo">
      <p>
        <ea-segmented id="sizeSegmented" value="default"></ea-segmented>
      </p>
      <div class="demo-date-picker">
        <div class="block">
          <span class="demonstration">Default</span>
          <ea-date-picker
            id="defaultDatePicker"
            variant="date"
            placeholder="Pick a Date"
          ></ea-date-picker>
        </div>
        <div class="block">
          <span class="demonstration">Disabled</span>
          <ea-date-picker
            id="disabledDatePicker"
            variant="date"
            placeholder="Pick a Date"
            value="2026-01-01"
            disabled
          ></ea-date-picker>
        </div>
        <div class="block">
          <span class="demonstration">Center Aligned</span>
          <ea-date-picker
            id="centerDatePicker"
            placeholder="Pick a Date"
            align="center"
          ></ea-date-picker>
        </div>
      </div>
    </div>

    <script type="module">
      const basicExample = {
        sizeSegmented: document.getElementById("sizeSegmented"),
        defaultDatePicker: document.getElementById("defaultDatePicker"),
        disabledDatePicker: document.getElementById("disabledDatePicker"),
        centerDatePicker: document.getElementById("centerDatePicker"),

        init() {
          this.sizeSegmented.options = ["small", "default", "large"];

          this.sizeSegmented.addEventListener("change", e => {
            this.defaultDatePicker.size = e.detail.value;
            this.disabledDatePicker.size = e.detail.value;
            this.centerDatePicker.size = e.detail.value;
          });
        },
      };

      basicExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  其他日期单位 -->
    <!-- #region -->
    <h2>其他日期单位</h2>

    <div class="demo demo-date-picker">
      <div class="block">
        <span class="demonstration">Year</span>
        <ea-date-picker placeholder="Pick a Year" variant="year"></ea-date-picker>
      </div>
      <div class="block">
        <span class="demonstration">Month</span>
        <ea-date-picker
          placeholder="Pick a Month"
          variant="month"
        ></ea-date-picker>
      </div>
      <div class="block">
        <span class="demonstration">Date</span>
        <ea-date-picker placeholder="Pick a Date" variant="date"></ea-date-picker>
      </div>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 日期格式  --------  -->
    <!-- #region  -->
    <h2>日期格式</h2>

    <div class="demo demo-date-picker">
      <div class="block">
        <span class="demonstration">Emits Date object</span>
        <div class="demonstration" id="value1">Value:</div>
        <ea-date-picker
          id="formatPicker1"
          variant="date"
          placeholder="Pick a Date"
          display-format="YYYY/MM/DD"
        ></ea-date-picker>
      </div>
      <div class="block">
        <span class="demonstration">Use value-format</span>
        <div class="demonstration" id="value2">Value:</div>
        <ea-date-picker
          id="formatPicker2"
          variant="date"
          placeholder="Pick a Date"
          display-format="YYYY/MM/DD"
          value-format="YYYY-MM-DD"
        ></ea-date-picker>
      </div>
      <div class="block">
        <span class="demonstration">Timestamp</span>
        <div class="demonstration" id="value3">Value:</div>
        <ea-date-picker
          id="formatPicker3"
          variant="date"
          placeholder="Pick a Date"
          display-format="YYYY/MM/DD"
          value-format="x"
        ></ea-date-picker>
      </div>
    </div>

    <script>
      const formatExample = {
        formatPicker1: document.getElementById("formatPicker1"),
        formatPicker2: document.getElementById("formatPicker2"),
        formatPicker3: document.getElementById("formatPicker3"),

        onChange: e => {
          const { target } = e;
          const valueEl = target.previousElementSibling;

          valueEl.textContent = "Value: " + target.value;
        },

        init() {
          this.formatPicker1.addEventListener("ea-change", this.onChange);
          this.formatPicker2.addEventListener("ea-change", this.onChange);
          this.formatPicker3.addEventListener("ea-change", this.onChange);
        },
      };
      formatExample.init();
    </script>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <hr />

    <!-- 公共方法测试 -->
    <!-- #region -->
    <h2>公共方法测试</h2>

    <div class="demo">
      <p>
        <ea-date-picker
          id="methodTestPicker"
          variant="date"
          placeholder="Pick a Date"
        ></ea-date-picker>
      </p>
      <p>
        <button id="focusBtn">focus()</button>
        <button id="blurBtn">blur()</button>
        <button id="openBtn">handleOpen()</button>
        <button id="closeBtn">handleClose()</button>
      </p>
    </div>

    <script type="module">
      const methodTestExample = {
        picker: document.getElementById("methodTestPicker"),
        focusBtn: document.getElementById("focusBtn"),
        blurBtn: document.getElementById("blurBtn"),
        openBtn: document.getElementById("openBtn"),
        closeBtn: document.getElementById("closeBtn"),

        init() {
          this.focusBtn.addEventListener("click", () => {
            this.picker.focus();
            console.log("focus() called");
          });

          this.blurBtn.addEventListener("click", () => {
            this.picker.blur();
            console.log("blur() called");
          });

          this.openBtn.addEventListener("click", e => {
            e.stopImmediatePropagation();
            this.picker.handleOpen();
            console.log("handleOpen() called");
          });

          this.closeBtn.addEventListener("click", e => {
            e.stopImmediatePropagation();
            this.picker.handleClose();
            console.log("handleClose() called");
          });
        },
      };

      methodTestExample.init();
    </script>
    <!-- #endregion -->
    <!-- end -->

    <hr />
  </body>
</html>
