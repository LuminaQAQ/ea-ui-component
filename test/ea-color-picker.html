<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>color-picker</title>
    

    <style>
      .row { margin: 1rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-color-picker/index.ts"
    ></script>
    <script type="module" src="../src/components/ea-button/index.ts"></script>

    <!-- 基础用法 -->
    <!-- #region -->
    <h2>基础用法</h2>

    <style>
      .demo-color-block {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
      }
      .demo-color-block .demonstration {
        margin-right: 16px;
      }
    </style>

    <div class="demo">
      <div class="demo-color-block">
        <span class="demonstration">With default value</span>
        <ea-color-picker value="#409eff"></ea-color-picker>
      </div>
      <div class="demo-color-block">
        <span class="demonstration">With no default value</span>
        <ea-color-picker clearable="false"></ea-color-picker>
      </div>
    </div>

    <hr />
    <!-- #endregion -->
    <!-- end -->

    <!--  禁用状态 -->
    <!-- #region -->
    <h2>禁用状态</h2>

    <div class="demo">
      <ea-color-picker value="#409eff" disabled></ea-color-picker>
      <ea-color-picker value="#67c23a" disabled></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  选择透明度 -->
    <!-- #region -->
    <h2>透明度支持</h2>

    <div class="demo">
      <ea-color-picker
        value="rgba(19, 206, 102, 0.8)"
        show-alpha
      ></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  预定义颜色 -->
    <!-- #region -->
    <h1>预定义颜色</h1>

    <div class="demo">
      <ea-color-picker id="predefinePicker" value="#409eff"></ea-color-picker>
    </div>

    <script type="module">
      const predefineExample = {
        picker: document.querySelector("#predefinePicker"),
        predefineList: [
          "#ff4500",
          "#ff8c00",
          "#ffd700",
          "#90ee90",
          "#00ced1",
          "#1e90ff",
          "#c71585",
        ],

        init() {
          this.picker.predefine = this.predefineList;
        },
      };
      predefineExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  不同尺寸 -->
    <!-- #region -->
    <h2>不同尺寸</h2>

    <div class="demo">
      <ea-color-picker value="#409eff" size="small"></ea-color-picker>
      <ea-color-picker value="#409eff"></ea-color-picker>
      <ea-color-picker value="#409eff" size="large"></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  独立面板 -->
    <!-- #region -->
    <h2>独立面板</h2>

    <div class="demo">
      <ea-color-picker-panel value="#409eff" clearable></ea-color-picker-panel>
      <ea-color-picker-panel
        value="rgba(64, 158, 255, 0.5)"
        show-alpha
      ></ea-color-picker-panel>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
