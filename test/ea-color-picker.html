<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>color-picker</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 2rem 0;
        border: none;
        border-top: 1px solid #eee;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-color-picker/index.js"
    ></script>
    <script type="module" src="../src/components/ea-button/index.js"></script>

    <!-- 基础用法 -->
    <!-- #region -->
    <h2>基础用法</h2>

    <div class="demo">
      <ea-color-picker></ea-color-picker>
      <ea-color-picker value="#409eff"></ea-color-picker>
      <ea-color-picker value="rgb(64, 158, 255)"></ea-color-picker>
      <ea-color-picker value="hsl(210, 100%, 63%)"></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion -->
    <!-- end -->

    <!--  独立面板 -->
    <!-- #region -->
    <h1>独立面板</h1>

    <div class="demo">
      <ea-color-picker-panel value="#409eff"></ea-color-picker-panel>
      <ea-color-picker-panel
        value="rgba(64, 158, 255, 0.5)"
        show-alpha
      ></ea-color-picker-panel>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  禁用状态 -->
    <!-- #region -->
    <h1>禁用状态</h1>

    <div class="demo">
      <ea-color-picker value="#409eff" disabled></ea-color-picker>
      <ea-color-picker value="#67c23a" disabled></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  可清除 -->
    <!-- #region -->
    <h1>可清除</h1>

    <div class="demo">
      <ea-color-picker value="#409eff" clearable></ea-color-picker>
      <ea-color-picker value="" clearable></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  不同尺寸 -->
    <!-- #region -->
    <h1>不同尺寸</h1>

    <div class="demo">
      <ea-color-picker value="#409eff" size="small"></ea-color-picker>
      <ea-color-picker value="#409eff"></ea-color-picker>
      <ea-color-picker value="#409eff" size="large"></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  透明度支持 -->
    <!-- #region -->
    <h1>透明度支持</h1>

    <div class="demo">
      <ea-color-picker
        value="rgba(64, 158, 255, 0.5)"
        color-format="rgb"
        show-alpha
      ></ea-color-picker>
      <ea-color-picker
        value="hsla(210, 100%, 63%, 0.3)"
        color-format="hsl"
        show-alpha
      ></ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  预定义颜色 -->
    <!-- #region -->
    <h1>预定义颜色</h1>

    <div class="demo">
      <ea-color-picker
        value="#409eff"
        predefine="['#ff4500','#ff8c00','#ffd700','#90ee90','#00ced1','#1e90ff','#c71585']"
      >
      </ea-color-picker>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  操作按钮 -->
    <!-- #region -->
    <h1>操作按钮</h1>

    <div class="demo">
      <ea-color-picker
        id="actionPicker"
        value="#409eff"
        clearable
      ></ea-color-picker>
      <p>点击颜色选择器查看底部操作按钮</p>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  事件监听 -->
    <!-- #region -->
    <h1>事件监听</h1>

    <div class="demo">
      <ea-color-picker
        id="eventPicker"
        value="#409eff"
        clearable
      ></ea-color-picker>
      <div
        id="eventLog"
        style="
          margin-top: 10px;
          padding: 10px;
          border: 1px solid #ccc;
          max-height: 200px;
          overflow-y: auto;
        "
      >
        <p>事件日志：</p>
      </div>
    </div>

    <script>
      const eventPicker = document.getElementById("eventPicker");
      const eventLog = document.getElementById("eventLog");

      function logEvent(eventName, detail) {
        const logEntry = document.createElement("p");
        logEntry.textContent = `${new Date().toLocaleTimeString()} - ${eventName}: ${JSON.stringify(detail)}`;
        eventLog.appendChild(logEntry);
        eventLog.scrollTop = eventLog.scrollHeight;
      }

      eventPicker.addEventListener("change", e => {
        logEvent("change", e.detail);
      });

      eventPicker.addEventListener("ea-active-change", e => {
        logEvent("ea-active-change", e.detail);
      });

      eventPicker.addEventListener("focus", () => {
        logEvent("focus", {});
      });

      eventPicker.addEventListener("blur", () => {
        logEvent("blur", {});
      });

      eventPicker.addEventListener("ea-clear", () => {
        logEvent("ea-clear", {});
      });
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  方法调用 -->
    <!-- #region -->
    <h1>方法调用</h1>

    <div class="demo">
      <ea-color-picker id="methodPicker" value="#409eff"></ea-color-picker>
      <ea-button id="showBtn">显示面板</ea-button>
      <ea-button id="hideBtn">隐藏面板</ea-button>
      <ea-button id="focusBtn">聚焦</ea-button>
      <ea-button id="blurBtn">失焦</ea-button>
      <ea-button id="clearBtn">清除颜色</ea-button>
    </div>

    <script>
      const methodPicker = document.getElementById("methodPicker");
      const showBtn = document.getElementById("showBtn");
      const hideBtn = document.getElementById("hideBtn");
      const focusBtn = document.getElementById("focusBtn");
      const blurBtn = document.getElementById("blurBtn");
      const clearBtn = document.getElementById("clearBtn");

      showBtn.addEventListener("click", () => {
        methodPicker.show();
      });

      hideBtn.addEventListener("click", () => {
        methodPicker.hide();
      });

      focusBtn.addEventListener("click", () => {
        methodPicker.focus();
      });

      blurBtn.addEventListener("click", () => {
        methodPicker.blur();
      });

      clearBtn.addEventListener("click", () => {
        methodPicker.value = "";
      });
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
