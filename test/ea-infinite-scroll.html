      hr {

        box-sizing: border-box;

        padding: 10px;

    ></script>
    <script
      type="module"
      src="../src/components/ea-scrollbar/index.js"
    ></script>
    <script type="module">
      const basicExample = {
        el: document.querySelector("#basicInfinite"),
        createTemplate(content) {
          const item = document.createElement("div");
          item.className = "sg-infinite-item";
          item.innerHTML = content;

          return item;
        },

        init() {
          this.el.addEventListener("loadmore", (e) => {
            for (let i = 0; i < 5; i++) {
              const index = this.el.children.length;
              this.el.appendChild(this.createTemplate(index + 1));
            }
          });
        },
      };
      basicExample.init();

        <ea-infinite-scroll id="basicInfinite">
          <div class="sg-infinite-item">1</div>
