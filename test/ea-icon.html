<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>icon</title>

    <style>
      hr {
        margin: 3rem 0;
      }

      body {
        width: 100%;
        height: 100%;

        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }

      .icon {
        box-sizing: border-box;

        padding: 0.5rem;
        width: 33%;
        flex: 1 0 33%;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-icon/index.ts"></script>
    <ea-icon name="user"></ea-icon>

    <ea-icon name="github" family="brands"></ea-icon>
    <ea-icon name="star" color="#ffa502" size="24"></ea-icon>
    <ea-icon name="spinner" spin></ea-icon>

</html>
