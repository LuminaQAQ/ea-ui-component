<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-breadcrumb Demo</title>
    <style>
      .row { margin: 1rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
      hr { margin: 2rem 0; border: none; border-top: 1px solid var(--grey-200, #e4e7ed); }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-breadcrumb/index.ts"
    ></script>
    <script type="module" src="../src/components/ea-icon/index.ts"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-breadcrumb separator="/">
        <ea-breadcrumb-item href="javascript:;">homepage</ea-breadcrumb-item>
        <ea-breadcrumb-item href="javascript:;">
          promotion management
        </ea-breadcrumb-item>
        <ea-breadcrumb-item>promotion list</ea-breadcrumb-item>
        <ea-breadcrumb-item>promotion detail</ea-breadcrumb-item>
      </ea-breadcrumb>
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- -------- 2. 图标分隔符 --------  -->
    <!-- #region  -->
    <h2>图标分隔符</h2>
    <div class="demo">
      <ea-breadcrumb>
        <ea-icon name="angle-right" slot="separator"></ea-icon>
        <ea-breadcrumb-item href="javascript:;">homepage</ea-breadcrumb-item>
        <ea-breadcrumb-item href="javascript:;">
          <span slot="separator">→</span>
          promotion management
        </ea-breadcrumb-item>
        <ea-breadcrumb-item>promotion list</ea-breadcrumb-item>
        <ea-breadcrumb-item>promotion detail</ea-breadcrumb-item>
      </ea-breadcrumb>
    </div>
    <hr />
    <!-- #endregion  -->
  </body>
</html>
