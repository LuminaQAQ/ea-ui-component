<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-statistic</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-statistic/index.js"
    ></script>
    <script type="module" src="../src/components/ea-button/index.js"></script>
    <script type="module" src="../node_modules/dayjs/dayjs.min.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-statistic title="Daily active users" value="268500"></ea-statistic>
      <ea-statistic value="138">
        <div slot="title" style="display: inline-flex; align-items: center">
          Ratio of men to women
          <ea-icon style="margin-left: 4px" size="12" icon="icon-mars">
          </ea-icon>
        </div>
        <div slot="suffix">/100</div>
      </ea-statistic>
      <ea-statistic title="Total Transactions" value="172000"></ea-statistic>
      <ea-statistic title="Feedback number" value="562">
        <div slot="suffix">
          <ea-icon style="vertical-align: middle" icon="icon-comment-empty">
          </ea-icon>
        </div>
      </ea-statistic>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  倒计时 -->
    <!-- #region -->
    <h1>倒计时</h1>

    <div class="demo">
      <ea-countdown id="countdown1" title="Start to grab"></ea-countdown>
      <div>
        <ea-countdown
          id="countdown2"
          title="Remaining VIP time"
          format="HH:mm:ss"
        >
        </ea-countdown>
        <ea-button
          type="primary"
          onclick="document.getElementById('countdown2').setAttribute('value', Date.now() + 1000 * 60 * 60 * 24 * 2);"
        >
          Reset
        </ea-button>
      </div>

      <div>
        <ea-countdown
          id="countdown3"
          title="Countdown"
          format="DD [days] HH:mm:ss"
        >
          <div style="display: inline-flex; align-items: center" slot="title">
            <ea-icon
              style="margin-right: 4px"
              size="12"
              icon="icon-calendar-times-o"
            >
            </ea-icon>
            <span> Still to go until next month </span>
          </div>
        </ea-countdown>
        <span id="countdownFooter"></span>
      </div>
    </div>

    <script type="module">
      const countdownExample = {
        countdown1: document.querySelector("#countdown1"),
        countdown2: document.querySelector("#countdown2"),
        countdown3: document.querySelector("#countdown3"),

        countdownFooter: document.querySelector("#countdownFooter"),

        init() {
          this.countdown1.setAttribute(
            "value",
            Date.now() + 1000 * 60 * 60 * 7
          );
          this.countdown2.setAttribute(
            "value",
            Date.now() + 1000 * 60 * 60 * 24 * 2
          );
          this.countdown3.setAttribute(
            "value",
            dayjs().add(1, "month").startOf("month")
          );

          this.countdownFooter.textContent = dayjs()
            .add(12, "month")
            .startOf("month")
            .format("YYYY-MM-DD");
        },
      };
      countdownExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
