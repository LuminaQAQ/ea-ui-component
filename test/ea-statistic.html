<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-statistic</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-statistic/index.ts"
    ></script>
    <script
      type="module"
      src="../src/components/ea-countdown/index.ts"
    ></script>
    <script type="module" src="../src/components/ea-button/index.ts"></script>
    <script type="module" src="../src/components/ea-tooltip/index.ts"></script>
    <script type="module" src="../node_modules/dayjs/dayjs.min.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-statistic heading="Daily active users" value="268500"></ea-statistic>
      <ea-statistic value="138">
        <div slot="title" style="display: inline-flex; align-items: center">
          Ratio of men to women
          <ea-icon style="margin-left: 4px" size="12" name="mars"> </ea-icon>
        </div>
        <div slot="suffix">/100</div>
      </ea-statistic>
      <ea-statistic heading="Total Transactions" value="172000"></ea-statistic>
      <ea-statistic heading="Feedback number" value="562">
        <div slot="suffix">
          <ea-icon style="vertical-align: middle" name="comment"> </ea-icon>
        </div>
      </ea-statistic>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  倒计时 -->
    <!-- #region -->
    <h1>倒计时</h1>

    <div class="demo">
      <ea-countdown id="countdown1" heading="Start to grab"></ea-countdown>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
        "
      >
        <ea-countdown
          id="countdown2"
          heading="Remaining VIP time"
          format="HH:mm:ss"
        >
        </ea-countdown>
        <ea-button
          type="primary"
          onclick="
            document
              .getElementById('countdown2')
              .setAttribute('value', Date.now() + 1000 * 60 * 60 * 24 * 2)
          "
        >
          Reset
        </ea-button>
      </div>

      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
        "
      >
        <ea-countdown
          id="countdown3"
          heading="Countdown"
          format="DD [days] HH:mm:ss"
        >
          <div style="display: inline-flex; align-items: center" slot="title">
            <ea-icon style="margin-right: 4px" size="12" name="calendar-xmark">
            </ea-icon>
            <span> Still to go until next month </span>
          </div>
        </ea-countdown>
        <span id="countdownFooter"></span>
      </div>
    </div>

    <script type="module">
      const countdownExample = {
        countdown1: document.querySelector("#countdown1"),
        countdown2: document.querySelector("#countdown2"),
        countdown3: document.querySelector("#countdown3"),

        countdownFooter: document.querySelector("#countdownFooter"),

        init() {
          this.countdown1.setAttribute(
            "value",
            Date.now() + 1000 * 60 * 60 * 7
          );
          this.countdown2.setAttribute(
            "value",
            Date.now() + 1000 * 60 * 60 * 24 * 2
          );
          this.countdown3.setAttribute(
            "value",
            dayjs().add(1, "month").startOf("month").format("YYYY-MM-DD")
          );

          this.countdownFooter.textContent = dayjs()
            .add(1, "month")
            .startOf("month")
            .format("YYYY-MM-DD");
        },
      };
      countdownExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  统计卡片 -->
    <!-- #region -->
    <h1>统计卡片</h1>

    <style>
      .statistic-card {
        box-sizing: border-box;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        height: 100%;
        padding: 20px;
        border-radius: 4px;
      }

      .statistic-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        margin-top: 16px;
      }

      .statistic-footer .footer-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .statistic-footer .footer-item span:last-child {
        display: inline-flex;
        align-items: center;
        margin-left: 4px;
      }

      .green {
        color: #67c23a;
      }
      .red {
        color: #f56c6c;
      }
    </style>

    <div class="demo row">
      <div class="statistic-card">
        <ea-statistic value="98500">
          <div style="display: inline-flex; align-items: center" slot="title">
            Daily active users
            <ea-tooltip
              effect="dark"
              content="Number of users who logged into the product in one day"
              placement="top"
            >
              <ea-icon
                style="margin-left: 4px"
                slot="reference"
                size="12"
                name="circle-exclamation"
              ></ea-icon>
            </ea-tooltip>
          </div>
        </ea-statistic>
        <div class="statistic-footer">
          <div class="footer-item">
            <span>than yesterday</span>
            <span class="green">
              24%
              <ea-icon name="angle-up"> </ea-icon>
            </span>
          </div>
        </div>
      </div>
      <div class="statistic-card">
        <ea-statistic value="693700">
          <div style="display: inline-flex; align-items: center" slot="title">
            Monthly Active Users
            <ea-tooltip
              effect="dark"
              content="Number of users who logged into the product in one month"
              placement="top"
            >
              <ea-icon
                style="margin-left: 4px"
                slot="reference"
                size="12"
                name="circle-exclamation"
              ></ea-icon>
            </ea-tooltip>
          </div>
        </ea-statistic>
        <div class="statistic-footer">
          <div class="footer-item">
            <span>month on month</span>
            <span class="red">
              12%
              <ea-icon name="angle-down"></ea-icon>
            </span>
          </div>
        </div>
      </div>
      <div class="statistic-card">
        <ea-statistic value="72000" heading="New transactions today">
          <div style="display: inline-flex; align-items: center" slot="title">
            New transactions today
          </div>
        </ea-statistic>
        <div class="statistic-footer">
          <div class="footer-item">
            <span>than yesterday</span>
            <span class="green">
              16%
              <ea-icon name="angle-up"> </ea-icon>
            </span>
          </div>
          <div class="footer-item">
            <ea-icon name="angle-up" size="14"> </ea-icon>
          </div>
        </div>
      </div>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
