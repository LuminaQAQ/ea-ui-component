<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-button/index.ts"></script>
    <script type="module">
      import { EaMessage } from "../src/components/ea-message/index.ts";
      import { EaMessageBox } from "../src/components/ea-message-box/index.ts";

      // ------- 消息提示 -------
      // #region
      const alertExample = {
        btn: document.querySelector("#openAlertMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            $alert("This is a message", "Title", {
              confirmButtonText: "OK",
            })
              .then(action => {
                $message.info(`action: ${action}`);
              })
              .catch(action => {
                $message.info(`action: ${action}`);
              });
          });
        },
      };
      alertExample.init();
      // #endregion
      // ------- end -------

      // ------- 确认消息 -------
      // #region
      const confirmExample = {
        btn: document.querySelector("#openconfirmMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            $confirm(
              "proxy will permanently delete the file. Continue?",
              "Warning",
              {
                confirmButtonText: "OK",
                cancelButtonText: "Cancel",
                variant: "warning",
              }
            )
              .then(action => {
                $message.info(`action: ${action}`);
              })
              .catch(action => {
                $message.info(`action: ${action}`);
              });
          });
        },
      };
      confirmExample.init();
      // #endregion
      // ------- end -------

      // ------- 提交内容 -------
      // #region
      const promptExample = {
        btn: document.querySelector("#openPromptMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            $prompt("Please input your e-mail", "Tip", {
              confirmButtonText: "OK",
              cancelButtonText: "Cancel",
              inputPattern:
                /\w[-\w.+]*@([A-Za-z0-9][-A-Za-z0-9]+\.)+[A-Za-z]{2,14}/,
              inputErrorMessage: "Invalid Email",
            })
              .then(action => {
                $message.success(`Your email is:${action}`);
              })
              .catch(action => {
                $message.info("Input canceled");
              });
          });
        },
      };
      promptExample.init();
      // #endregion
      // ------- end -------

      // ------- 个性化 -------
      // #region
      const personalizedExample = {
        btn: document.querySelector("#openPersonalizedMessageBox"),
        init() {
          this.btn.addEventListener("click", () => {
            EaMessageBox({
              heading: "Message",
              message: "This is a message",
              showCancelButton: true,
              confirmButtonText: "OK",
              cancelButtonText: "Cancel",
              beforeClose: (action, instance, done) => {
                if (action === "confirm") {
                  instance.confirmButtonLoading = true;
                  instance.confirmButtonText = "Loading...";
                  setTimeout(() => {
                    done();
                    setTimeout(() => {
                      instance.confirmButtonLoading = false;
                    }, 300);
                  }, 3000);
                } else {
                  done();
                }
              },
            })
              .then(action => {
                EaMessage({
                  variant: "info",
                  message: `action: ${action}`,
                });
              })
              .catch(action => {
                EaMessage({
                  variant: "info",
                  message: `action: ${action}`,
                });
              });
          });
        },
      };
      personalizedExample.init();
      // #endregion
      // ------- end -------

      // ------- 使用 HTML 片段 -------
      // #region
      const useHTMLExample = {
        btn: document.querySelector("#openUseHTMLMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            EaMessageBox.alert(
              "<strong>proxy is <i>HTML</i> string</strong>",
              "HTML String",
              {
                dangerouslyUseHTMLString: true,
              }
            );
          });
        },
      };
      useHTMLExample.init();
      // #endregion
      // ------- end -------

      // ------- 区分取消操作与关闭操作 -------
      // #region
      const openDistinguishCancelAndCloseExample = {
        btn: document.querySelector("#openDistinguishCancelAndCloseMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            EaMessageBox.confirm(
              "You have unsaved changes, save and proceed?",
              "Confirm",
              {
                distinguishCancelAndClose: true,
                confirmButtonText: "Save",
                cancelButtonText: "Discard Changes",
              }
            )
              .then(() => {
                EaMessage({
                  variant: "info",
                  message: "Changes saved. Proceeding to a new route.",
                });
              })
              .catch(action => {
                EaMessage({
                  variant: "info",
                  message:
                    action === "cancel"
                      ? "Changes discarded. Proceeding to a new route."
                      : "Stay in the current route",
                });
              });
          });
        },
      };
      openDistinguishCancelAndCloseExample.init();
      // #endregion
      // ------- end -------

      // ------- 内容居中 -------
      // #region
      const centerExample = {
        btn: document.querySelector("#openCenterMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            EaMessageBox.confirm(
              "proxy will permanently delete the file. Continue?",
              "Warning",
              {
                confirmButtonText: "OK",
                cancelButtonText: "Cancel",
                variant: "warning",
                center: true,
              }
            )
              .then(() => {
                EaMessage({
                  variant: "success",
                  message: "Delete completed",
                });
              })
              .catch(() => {
                EaMessage({
                  variant: "info",
                  message: "Delete canceled",
                });
              });
          });
        },
      };
      centerExample.init();
      // #endregion
      // ------- end -------

      // ------- 可拖放 -------
      // #region
      const draggableExample = {
        btn: document.querySelector("#openDraggableMessageBox"),

        init() {
          this.btn.addEventListener("click", () => {
            EaMessageBox.confirm(
              "proxy will permanently delete the file. Continue?",
              "Warning",
              {
                confirmButtonText: "OK",
                cancelButtonText: "Cancel",
                variant: "warning",
                movable: true,
              }
            )
              .then(() => {
                EaMessage({
                  variant: "success",
                  message: "Delete completed",
                });
              })
              .catch(() => {
                EaMessage({
                  variant: "info",
                  message: "Delete canceled",
                });
              });
          });
        },
      };
      draggableExample.init();
      // #endregion
      // ------- end -------
    </script>

    <!-- -------- 消息提示 --------  -->
    <!-- #region  -->
    <h2>消息提示</h2>
    <div class="demo">
      <ea-button id="openAlertMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 确认消息 --------  -->
    <!-- #region  -->
    <h2>确认消息</h2>
    <ea-button id="openconfirmMessageBox" plain
      >Click to open Message Box</ea-button
    >
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 提交内容 --------  -->
    <!-- #region  -->
    <h2>提交内容</h2>
    <div class="demo">
      <ea-button id="openPromptMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- #region 个性化 -->
    <h1>个性化</h1>

    <div class="demo">
      <ea-button id="openPersonalizedMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- #region 使用 HTML 片段 -->
    <h1>使用 HTML 片段</h1>

    <div class="demo">
      <ea-button id="openUseHTMLMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- #region 区分取消操作与关闭操作 -->
    <h1>区分取消操作与关闭操作</h1>

    <div class="demo">
      <ea-button id="openDistinguishCancelAndCloseMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- #region 内容居中 -->
    <h1>内容居中</h1>

    <div class="demo">
      <ea-button id="openCenterMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>

    <hr />
    <!-- #endregion  -->

    <!-- #region 可拖放 -->
    <h1>可拖放</h1>

    <div class="demo">
      <ea-button id="openDraggableMessageBox" plain
        >Click to open Message Box</ea-button
      >
    </div>

    <hr />
    <!-- #endregion  -->
  </body>
</html>
