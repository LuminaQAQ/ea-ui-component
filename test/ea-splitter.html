<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
        html,
        body {
            margin: 0;
            padding: 0;

            height: 100%;
            width: 100%;
        }

        hr {
            margin: 2rem 0;
            border: none;
            border-top: 1px solid var(--grey-200, #e4e7ed);
        }

        .demo-panel {
            display: flex;
            align-items: center;
            justify-content: center;

            height: 100%;

            font-size: 1.5rem;

            overflow: hidden;
        }

        .section {
            height: 300px;
            box-shadow: #ccc 0px 0px 10px;
        }
    </style>
</head>

<body>
    <script type="module" src="/src/components/ea-splitter/index.ts"></script>

    <!-- #region 基础用法 -->
    <h2>基础用法</h2>
    <div class="demo">
        <div class="section">
            <ea-splitter class="section">
                <ea-splitter-panel min="30%">
                    <div class="demo-panel">1</div>
                </ea-splitter-panel>
                <ea-splitter-panel size="20%" min="20%">
                    <div class="demo-panel">2</div>
                </ea-splitter-panel>
                <ea-splitter-panel size="10%">
                    <div class="demo-panel">3</div>
                </ea-splitter-panel>
            </ea-splitter>
        </div>
    </div>
    <hr>
    <!-- #endregion  -->

    <!-- #region 垂直布局 -->
    <h2>垂直布局</h2>
    <div class="demo">
        <div class="section">
            <ea-splitter layout="vertical">
                <ea-splitter-panel min="30%">
                    <div class="demo-panel">1</div>
                </ea-splitter-panel>
                <ea-splitter-panel size="20%" min="20%">
                    <div class="demo-panel">2</div>
                </ea-splitter-panel>
                <ea-splitter-panel size="10%">
                    <div class="demo-panel">3</div>
                </ea-splitter-panel>
            </ea-splitter>
        </div>
    </div>
    <hr>
    <!-- #endregion  -->

    <script>
        const eaSplitter = document.querySelector('ea-splitter');
        eaSplitter.addEventListener('ea-panel-resize-start', (e) => {
            console.log('ea-panel-resize-start', e.detail.size);
        });
        eaSplitter.addEventListener('ea-panel-resize', (e) => {
            console.log('ea-panel-resize', e.detail.size);
        });
        eaSplitter.addEventListener('ea-panel-resize-end', (e) => {
            console.log('ea-panel-resize-end', e.detail.size);
        });
    </script>

</html>
</html>
