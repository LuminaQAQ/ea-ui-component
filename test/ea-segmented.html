<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-segmented</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-segmented/index.ts"
    ></script>
    <script type="module" src="../src/components/ea-icon/index.ts"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented
        id="basicSegmentedLarge"
        name="week"
        value="Mon"
        size="large"
      ></ea-segmented>
      <ea-segmented
        id="basicSegmentedDefault"
        name="week"
        value="Mon"
        size="default"
      ></ea-segmented>
      <ea-segmented
        id="basicSegmentedSmall"
        name="week"
        value="Mon"
        size="small"
      ></ea-segmented>
    </div>

    <script type="module">
      const basicExample = {
        els: [
          document.querySelector("#basicSegmentedLarge"),
          document.querySelector("#basicSegmentedDefault"),
          document.querySelector("#basicSegmentedSmall"),
        ],
        options: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],

        init() {
          this.els.forEach(el => {
            el.options = this.options;

            el.addEventListener("change", e => {
              this.els.forEach(el => {
                el.value = e.detail.value;
              });
            });
          });
        },
      };

      basicExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  配置方向 -->
    <!-- #region -->
    <h1>配置方向</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented
        id="sizeSegmented"
        name="size"
        value="default"
      ></ea-segmented>
      <ea-segmented
        id="directionSegmented"
        name="direction"
        value="horizontal"
      ></ea-segmented>
      <ea-segmented
        id="directionSegmentedOptions"
        name="fruit"
        value="Apple"
      ></ea-segmented>
    </div>

    <script type="module">
      const directionExample = {
        sizeSegmented: document.querySelector("#sizeSegmented"),
        directionSegmented: document.querySelector("#directionSegmented"),
        directionSegmentedOptions: document.querySelector(
          "#directionSegmentedOptions"
        ),
        sizeOptions: ["large", "default", "small"],
        directionOptions: [
          { label: "Horizontal", value: "horizontal" },
          { label: "Vertical", value: "vertical" },
        ],
        options: [
          {
            label: "Apple",
            value: "Apple",
          },
          {
            label: "Cherry",
            value: "Cherry",
          },
          {
            label: "Grape",
            value: "Grape",
          },
          {
            label: "Orange",
            value: "Orange",
          },
          {
            label: "Pear",
            value: "Pear",
          },
          {
            label: "Watermelon",
            value: "Watermelon",
            disabled: true,
          },
        ],

        init() {
          this.sizeSegmented.options = this.sizeOptions;
          this.directionSegmented.options = this.directionOptions;
          this.directionSegmentedOptions.options = this.options;

          this.sizeSegmented.addEventListener("change", e => {
            this.directionSegmentedOptions.size = e.detail.value;
          });

          this.directionSegmented.addEventListener("change", e => {
            console.log(e.detail.value);

            this.directionSegmentedOptions.direction = e.detail.value;
          });
        },
      };

      directionExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  禁用状态 -->
    <!-- #region -->
    <h1>禁用状态</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented
        id="disabledSegmented1"
        name="week"
        value="Mon"
        disabled
      ></ea-segmented>
      <ea-segmented
        id="disabledSegmented2"
        name="week"
        value="Mon"
      ></ea-segmented>
    </div>

    <script type="module">
      const disabledExample = {
        disabledSegmented1: document.querySelector("#disabledSegmented1"),
        disabledSegmented2: document.querySelector("#disabledSegmented2"),

        options: [
          {
            label: "Mon",
            value: "Mon",
            disabled: true,
          },
          {
            label: "Tue",
            value: "Tue",
          },
          {
            label: "Wed",
            value: "Wed",
            disabled: true,
          },
          {
            label: "Thu",
            value: "Thu",
          },
          {
            label: "Fri",
            value: "Fri",
            disabled: true,
          },
          {
            label: "Sat",
            value: "Sat",
          },
          {
            label: "Sun",
            value: "Sun",
          },
        ],

        init() {
          this.disabledSegmented1.options = this.options;
          this.disabledSegmented2.options = this.options;

          this.disabledSegmented1.addEventListener("change", e => {
            this.disabledSegmented2.value = e.detail.value;
          });

          this.disabledSegmented2.addEventListener("change", e => {
            this.disabledSegmented1.value = e.detail.value;
          });
        },
      };

      disabledExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  自定义选项 -->
    <!-- #region -->
    <h1>自定义选项</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented id="customSegmented" name="week" value="Mon"></ea-segmented>
    </div>

    <script type="module">
      const customExample = {
        customSegmented: document.querySelector("#customSegmented"),
        options: [
          {
            myLabel: "Mon",
            myValue: "Mon",
            myDisabled: true,
          },
          {
            myLabel: "Tue",
            myValue: "Tue",
          },
          {
            myLabel: "Wed",
            myValue: "Wed",
            myDisabled: true,
          },
          {
            myLabel: "Thu",
            myValue: "Thu",
          },
          {
            myLabel: "Fri",
            myValue: "Fri",
            myDisabled: true,
          },
          {
            myLabel: "Sat",
            myValue: "Sat",
          },
          {
            myLabel: "Sun",
            myValue: "Sun",
          },
        ],

        init() {
          this.customSegmented.propsConfiguration = {
            label: "myLabel",
            value: "myValue",
            disabled: "myDisabled",
          };
          this.customSegmented.options = this.options;
        },
      };

      customExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  Block 分段选择器 -->
    <!-- #region -->
    <h1>Block 分段选择器</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented
        id="blockSegmented"
        name="week"
        value="Mon"
        block
      ></ea-segmented>
    </div>

    <script type="module">
      const blockExample = {
        blockSegmented: document.querySelector("#blockSegmented"),
        options: [
          "Mon",
          "Tue",
          "Wed",
          "Thu",
          "Fri",
          "Sat",
          "Sunday long long long long long long long",
        ],

        init() {
          this.blockSegmented.options = this.options;
        },
      };

      blockExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  自定义样式 -->
    <!-- #region -->
    <h1>自定义样式</h1>

    <style>
      #customStyleSegmented {
        --ea-segmented-item-checked-color: black;
        --ea-segmented-indicator-color: #ffd100;
        --ea-segmented-border-radius: 16px;
      }
    </style>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented id="customStyleSegmented" name="fruit" value="Apple">
      </ea-segmented>
    </div>

    <script type="module">
      const customStyleExample = {
        blockSegmented: document.querySelector("#customStyleSegmented"),
        options: [
          {
            label: "Apple",
            value: "Apple",
          },
          {
            label: "Cherry",
            value: "Cherry",
          },
          {
            label: "Grape",
            value: "Grape",
          },
          {
            label: "Orange",
            value: "Orange",
          },
          {
            label: "Pear",
            value: "Pear",
          },
          {
            label: "Watermelon",
            value: "Watermelon",
          },
        ],

        init() {
          this.blockSegmented.options = this.options;
        },
      };

      customStyleExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
