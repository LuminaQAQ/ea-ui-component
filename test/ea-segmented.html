<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-segmented</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-segmented/index.js"
    ></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented
        id="basicSegmentedLarge"
        name="week"
        value="Mon"
        size="large"
      ></ea-segmented>
      <ea-segmented
        id="basicSegmentedDefault"
        name="week"
        value="Mon"
        size="default"
      ></ea-segmented>
      <ea-segmented
        id="basicSegmentedSmall"
        name="week"
        value="Mon"
        size="small"
      ></ea-segmented>
    </div>

    <script type="module">
      const basicExample = {
        els: [
          document.querySelector("#basicSegmentedLarge"),
          document.querySelector("#basicSegmentedDefault"),
          document.querySelector("#basicSegmentedSmall"),
        ],
        options: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],

        init() {
          this.els.forEach((el) => {
            el.options = this.options;

            el.addEventListener("change", (e) => {
              console.log(e.detail.value);
            });
          });
        },
      };

      basicExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  配置方向 -->
    <!-- #region -->
    <h1>配置方向</h1>

    <div class="demo" style="display: flex; flex-direction: column">
      <ea-segmented
        id="sizeSegmented"
        name="size"
        value="default"
      ></ea-segmented>
      <ea-segmented
        id="directionSegmented"
        name="direction"
        value="horizontal"
      ></ea-segmented>
      <ea-segmented
        id="directionSegmentedOptions"
        name="fruit"
        value="Apple"
      ></ea-segmented>
    </div>

    <script type="module">
      const directionExample = {
        sizeSegmented: document.querySelector("#sizeSegmented"),
        directionSegmented: document.querySelector("#directionSegmented"),
        directionSegmentedOptions: document.querySelector(
          "#directionSegmentedOptions"
        ),
        sizeOptions: ["large", "default", "small"],
        directionOptions: [
          { label: "Horizontal", value: "horizontal" },
          { label: "Vertical", value: "vertical" },
        ],
        options: [
          {
            label: "Apple",
            value: "Apple",
          },
          {
            label: "Cherry",
            value: "Cherry",
          },
          {
            label: "Grape",
            value: "Grape",
          },
          {
            label: "Orange",
            value: "Orange",
          },
          {
            label: "Pear",
            value: "Pear",
          },
          {
            label: "Watermelon",
            value: "Watermelon",
            disabled: true,
          },
        ],

        init() {
          this.sizeSegmented.options = this.sizeOptions;
          this.directionSegmented.options = this.directionOptions;
          this.directionSegmentedOptions.options = this.options;

          this.sizeSegmented.addEventListener("change", (e) => {
            this.directionSegmentedOptions.size = e.detail.value;
          });

          this.directionSegmented.addEventListener("change", (e) => {
            console.log(e.detail.value);

            this.directionSegmentedOptions.direction = e.detail.value;
          });
        },
      };

      directionExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
