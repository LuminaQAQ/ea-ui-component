<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script
      type="module"
      src="../src/components/ea-input-number/index.js"
    ></script>

    <!-- -------- 基础用法 --------  -->
    <!-- #region  -->
    <h2>基础用法</h2>
    <div class="demo">
      <ea-input-number value="1" min="1" max="10"></ea-input-number>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 禁用状态 --------  -->
    <!-- #region  -->
    <h2>禁用状态</h2>
    <div class="demo">
      <ea-input-number disabled></ea-input-number>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  步进 -->
    <!-- #region -->
    <h1>步进</h1>

    <div class="demo">
      <ea-input-number value="5" step="2"></ea-input-number>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  严格步进 -->
    <!-- #region -->
    <h1>严格步进</h1>

    <div class="demo">
      <ea-input-number value="2" step="2" step-strictly></ea-input-number>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 精度 --------  -->
    <!-- #region  -->
    <h2>精度</h2>
    <div class="demo">
      <ea-input-number value="1" step="0.1" precision="1"></ea-input-number>
      <ea-input-number value="1" step="0.01" precision="2"></ea-input-number>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  不同的输入框尺寸 -->
    <!-- #region -->
    <h1>不同的输入框尺寸</h1>

    <div class="demo">
      <ea-input-number size="large"></ea-input-number>
      <ea-input-number size="default"></ea-input-number>
      <ea-input-number size="small"></ea-input-number>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
