<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-slider Demo</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }

      .demo {
        margin-bottom: 2rem;
      }

      .vertical-demo {
        display: flex;
        align-items: center;
        gap: 2rem;
        height: 300px;
      }

      .vertical-demo ea-slider {
        height: 200px;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-slider/index.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <style>
      .slider-demo-block {
        max-width: 600px;
        display: flex;
        align-items: center;
      }
      .slider-demo-block .el-slider {
        margin-top: 0;
        margin-left: 12px;
      }
      .slider-demo-block .demonstration {
        font-size: 14px;
        line-height: 44px;
        flex: 1 0 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-bottom: 0;
      }
    </style>

    <div class="demo">
      <div class="slider-demo-block">
        <span class="demonstration">Default value</span>
        <ea-slider value="50"></ea-slider>
      </div>
      <div class="slider-demo-block">
        <span class="demonstration">Customized initial value</span>
        <ea-slider value="70"></ea-slider>
      </div>
      <div class="slider-demo-block">
        <span class="demonstration">Hide Tooltip</span>
        <ea-slider value="50" show-tooltip="false"></ea-slider>
      </div>
      <div class="slider-demo-block">
        <span class="demonstration">Format Tooltip</span>
        <ea-slider id="formatTooltipSlider" value="50"></ea-slider>
      </div>
      <div class="slider-demo-block">
        <span class="demonstration">Disabled</span>
        <ea-slider value="50" disabled></ea-slider>
      </div>
    </div>

    <script type="module">
      const formatTooltipExample = {
        slider: document.querySelector("#formatTooltipSlider"),

        tooltipFormat: value => value + "%",

        init() {
          this.slider.formatTooltip = this.tooltipFormat;
        },
      };

      formatTooltipExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  离散值 -->
    <!-- #region -->
    <h1>离散值</h1>

    <div class="demo">
      <div class="slider-demo-block">
        <span class="demonstration">Breakpoints not displayed</span>
        <ea-slider value="0" step="10"></ea-slider>
      </div>
      <div class="slider-demo-block">
        <span class="demonstration">Breakpoints displayed</span>
        <ea-slider value="0" step="10" show-stops></ea-slider>
      </div>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  带有输入框的滑块 -->
    <!-- #region -->
    <h1>带有输入框的滑块</h1>

    <div class="demo">
      <ea-slider value="50" show-input></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  不同尺寸 -->
    <!-- #region -->
    <h1>不同尺寸</h1>

    <div class="demo">
      <ea-slider value="50" size="small"></ea-slider>
      <br />
      <ea-slider value="50"></ea-slider>
      <br />
      <ea-slider value="50" size="large"></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  自定义 Tooltip 提示的位置 -->
    <!-- #region -->
    <h1>自定义 Tooltip 提示的位置</h1>

    <div class="demo">
      <ea-slider value="50" show-tooltip tooltip-placement="top"></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  垂直模式 -->
    <!-- #region -->
    <h1>垂直模式</h1>

    <div class="demo vertical-demo">
      <ea-slider value="50" vertical></ea-slider>
      <ea-slider value="[30, 70]" range vertical></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  设置 marks 属性可以在滑块上显示标记 -->
    <!-- #region -->
    <h1>设置 marks 属性可以在滑块上显示标记</h1>

    <div class="demo">
      <ea-slider value="0" id="marksSlider"></ea-slider>
    </div>

    <script type="module">
      const marksSlider = document.querySelector("#marksSlider");
      marksSlider.marks = {
        0: "0°C",
        26: "26°C",
        37: "37°C",
        50: "50°C",
        100: "100°C",
      };
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <div style="height: 10rem"></div>
  </body>
</html>
