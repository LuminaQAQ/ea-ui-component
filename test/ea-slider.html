<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ea-slider Demo</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }

      .demo {
        margin-bottom: 2rem;
      }

      .vertical-demo {
        display: flex;
        align-items: center;
        gap: 2rem;
        height: 300px;
      }

      .vertical-demo ea-slider {
        height: 200px;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-slider/index.js"></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-slider value="50"></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  离散值 -->
    <!-- #region -->
    <h1>离散值</h1>

    <div class="demo">
      <ea-slider value="0" step="10"></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  带有输入框的滑块 -->
    <!-- #region -->
    <h1>带有输入框的滑块</h1>

    <div class="demo">
      <ea-slider value="50" show-input></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  不同尺寸 -->
    <!-- #region -->
    <h1>不同尺寸</h1>

    <div class="demo">
      <ea-slider value="50" size="small"></ea-slider>
      <br />
      <ea-slider value="50"></ea-slider>
      <br />
      <ea-slider value="50" size="large"></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  自定义 Tooltip 提示的位置 -->
    <!-- #region -->
    <h1>自定义 Tooltip 提示的位置</h1>

    <div class="demo">
      <ea-slider value="50" show-tooltip tooltip-placement="top"></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  范围选择 -->
    <!-- #region -->
    <h1>范围选择</h1>

    <div class="demo">
      <ea-slider value="[30, 70]" range></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  垂直模式 -->
    <!-- #region -->
    <h1>垂直模式</h1>

    <div class="demo vertical-demo">
      <ea-slider value="50" vertical></ea-slider>
      <ea-slider value="[30, 70]" range vertical></ea-slider>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  设置 marks 属性可以在滑块上显示标记 -->
    <!-- #region -->
    <h1>设置 marks 属性可以在滑块上显示标记</h1>

    <div class="demo">
      <ea-slider value="0" id="marksSlider"></ea-slider>
    </div>

    <script type="module">
      const marksSlider = document.querySelector("#marksSlider");
      marksSlider.marks = {
        0: "0°C",
        26: "26°C",
        37: "37°C",
        50: "50°C",
        100: "100°C",
      };
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <div style="height: 10rem"></div>
  </body>
</html>
