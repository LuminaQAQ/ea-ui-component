<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />
    <style>
      hr {
        margin: 3rem 0;
      }

      ea-steps::part(container) {
        min-height: 90px;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-icon/index.js"></script>
    <script type="module" src="../src/components/ea-steps/index.js"></script>
    <script type="module" src="../src/components/ea-button/index.js"></script>
    <script
      type="module"
      src="../src/components/ea-button-group/index.js"
    ></script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <p>
        <ea-button id="basicStepsPrevBtn">上一步</ea-button>
        <ea-button id="basicStepsNextBtn">下一步</ea-button>
      </p>
      <ea-steps id="basicSteps" active="0" finish-status="success">
        <ea-step
          title="Step 1"
          description="This is the description for Step 1"
        ></ea-step>
        <ea-step
          title="Step 2"
          description="This is the description for Step 2"
        ></ea-step>
        <ea-step
          title="Step 3"
          description="This is the description for Step 3"
        ></ea-step>
        <ea-step
          title="Step 4"
          description="This is the description for Step 4"
        ></ea-step>
      </ea-steps>
    </div>

    <script type="module">
      const basicExample = {
        steps: document.querySelector("#basicSteps"),

        prevBtn: document.querySelector("#basicStepsPrevBtn"),
        nextBtn: document.querySelector("#basicStepsNextBtn"),

        stepChildren: [...document.querySelectorAll("#basicSteps > ea-step")],

        init() {
          let active = new Proxy(
            { value: parseInt(this.steps.getAttribute("active")) },
            {
              get: (target, prop) => {
                return target[prop];
              },
              set: (target, prop, value) => {
                if (value < 0) value = this.stepChildren.length;
                if (value > this.stepChildren.length) value = 0;

                target[prop] = value;
                this.steps.setAttribute("active", value);
                return true;
              },
            }
          );

          this.prevBtn.addEventListener("click", () => {
            active.value--;
          });

          this.nextBtn.addEventListener("click", () => {
            active.value++;
          });
        },
      };

      basicExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 2. 含状态步骤条 --------  -->
    <!-- #region  -->
    <h2>含状态步骤条</h2>
    <ea-steps active="1" finish-status="success">
      <ea-step title="已完成"></ea-step>
      <ea-step title="进行中"></ea-step>
      <ea-step title="步骤 3"></ea-step>
    </ea-steps>
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 2. 含状态步骤条 --------  -->
    <!-- #region  -->
    <h2>含状态步骤条</h2>
    <ea-steps active="1" finish-status="success">
      <ea-step title="已完成"></ea-step>
      <ea-step title="进行中"></ea-step>
      <ea-step title="步骤 3"></ea-step>
    </ea-steps>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 3. 有描述的步骤条 --------  -->
    <!-- #region  -->
    <h2>有描述的步骤条</h2>
    <ea-steps :active="1">
      <ea-step
        title="步骤 1"
        description="这是一段很长很长很长的描述性文字"
      ></ea-step>
      <ea-step
        title="步骤 2"
        description="这是一段很长很长很长的描述性文字"
      ></ea-step>
      <ea-step title="步骤 3" description="这段就没那么长了"></ea-step>
    </ea-steps>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 4. 自定义每个 step 的间距 --------  -->
    <!-- #region  -->
    <h2>自定义每个 step 的间距</h2>
    <ea-steps active="1" space="100px">
      <ea-step title="步骤 1" icon="icon-music"></ea-step>
      <ea-step title="步骤 2" icon="icon-videocam"></ea-step>
      <ea-step title="步骤 3" icon="icon-camera"></ea-step>
    </ea-steps>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!-- -------- 5. 简洁风格的步骤条 --------  -->
    <!-- #region  -->
    <h2>简洁风格的步骤条</h2>
    <ea-steps active="1" simple>
      <ea-step title="步骤 1" icon="icon-music"></ea-step>
      <ea-step title="步骤 2" icon="icon-videocam"></ea-step>
      <ea-step title="步骤 3" icon="icon-camera"></ea-step>
    </ea-steps>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
