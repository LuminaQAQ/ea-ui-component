<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tree</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-tree/index.js"></script>

    <script>
      window.data = [
        {
          label: "Level one 1",
          children: [
            {
              label: "Level two 1-1",
              children: [
                {
                  label: "Level three 1-1-1",
                },
              ],
            },
          ],
        },
        {
          label: "Level one 2",
          children: [
            {
              label: "Level two 2-1",
              children: [
                {
                  label: "Level three 2-1-1",
                },
              ],
            },
            {
              label: "Level two 2-2",
              children: [
                {
                  label: "Level three 2-2-1",
                },
              ],
            },
          ],
        },
        {
          label: "Level one 3",
          children: [
            {
              label: "Level two 3-1",
              children: [
                {
                  label: "Level three 3-1-1",
                },
              ],
            },
            {
              label: "Level two 3-2",
              children: [
                {
                  label: "Level three 3-2-1",
                },
              ],
            },
          ],
        },
      ];

      window.idData = [
        {
          id: 1,
          label: "Level one 1",
          children: [
            {
              id: 3,
              label: "Level two 2-1",
              children: [
                {
                  id: 4,
                  label: "Level three 3-1-1",
                },
                {
                  id: 5,
                  label: "Level three 3-1-2",
                  disabled: true,
                },
              ],
            },
            {
              id: 2,
              label: "Level two 2-2",
              disabled: true,
              children: [
                {
                  id: 6,
                  label: "Level three 3-2-1",
                },
                {
                  id: 7,
                  label: "Level three 3-2-2",
                  disabled: true,
                },
              ],
            },
          ],
        },
      ];
    </script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-tree id="basicTree"></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#basicTree");

      tree.data = window.data;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  可选择 -->
    <!-- #region -->
    <h1>可选择</h1>

    <div class="demo">
      <ea-tree id="checkboxTree" show-checkbox></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#checkboxTree");
      tree.data = window.data;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  禁用复选框 -->
    <!-- #region -->
    <h1>禁用复选框</h1>

    <div class="demo">
      <ea-tree id="disabledCheckboxTree" show-checkbox></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#disabledCheckboxTree");
      tree.data = window.idData;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  默认展开以及默认选中 -->
    <!-- #region -->
    <h1>默认展开以及默认选中</h1>

    <div class="demo">
      <ea-tree id="defaultExpandedTree" node-key="id" show-checkbox></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#defaultExpandedTree");
      tree.defaultExpandedKeys = [1, 2];
      tree.defaultCheckedKeys = [3, 4];
      tree.data = window.idData;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  新增方法测试 -->
    <!-- #region -->
    <h1>新增方法测试</h1>

    <div class="demo">
      <ea-tree id="methodTestTree" node-key="id" show-checkbox></ea-tree>
    </div>

    <div style="margin-top: 20px">
      <h3>基础方法测试</h3>
      <button onclick="testGetHalfCheckedNodes()">
        测试 getHalfCheckedNodes
      </button>
      <button onclick="testGetHalfCheckedKeys()">
        测试 getHalfCheckedKeys
      </button>
      <button onclick="testGetCurrentKey()">测试 getCurrentKey</button>
      <button onclick="testGetCurrentNode()">测试 getCurrentNode</button>
      <button onclick="selectNode3()">选中节点3</button>
      <button onclick="selectNode4()">选中节点4</button>
      <button onclick="setHalfCheckedState()">设置半选中状态</button>

      <h3 style="margin-top: 20px">新增方法测试</h3>
      <button onclick="testUpdateKeyChildren()">测试 updateKeyChildren</button>
      <button onclick="testGetCheckedNodes()">测试 getCheckedNodes</button>
      <button onclick="testSetCheckedNodes()">测试 setCheckedNodes</button>
      <button onclick="testGetCheckedKeys()">测试 getCheckedKeys</button>
      <button onclick="testSetCheckedKeys()">测试 setCheckedKeys</button>
      <button onclick="testSetChecked()">测试 setChecked</button>

      <h3 style="margin-top: 20px">最新方法测试</h3>
      <button onclick="testSetCurrentKey()">测试 setCurrentKey</button>
      <button onclick="testSetCurrentNode()">测试 setCurrentNode</button>
      <button onclick="testGetNode()">测试 getNode</button>
      <button onclick="testRemove()">测试 remove</button>
      <button onclick="testAppend()">测试 append</button>
      <button onclick="testInsertBefore()">测试 insertBefore</button>
      <button onclick="testInsertAfter()">测试 insertAfter</button>
      <button onclick="runAllTests()">运行所有测试</button>
    </div>

    <div
      id="testResult"
      style="
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        min-height: 100px;
      "
    >
      <p>测试结果将显示在这里</p>
    </div>

    <script type="module">
      const tree = document.querySelector("#methodTestTree");
      tree.defaultExpandedKeys = [1, 2];
      tree.defaultCheckedKeys = [3, 4];
      tree.data = window.idData;

      // 等待树组件渲染完成
      setTimeout(() => {
        const resultDiv = document.getElementById("testResult");
        resultDiv.innerHTML = "<p>树组件已加载完成，可以开始测试</p>";
      }, 500);

      // 测试方法
      window.testGetHalfCheckedNodes = function () {
        const tree = document.querySelector("#methodTestTree");
        const result = tree.getHalfCheckedNodes();
        const resultDiv = document.getElementById("testResult");
        resultDiv.innerHTML = `
          <h3>getHalfCheckedNodes() 测试结果：</h3>
          <p>返回半选中节点数量: ${result.length}</p>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
      };

      window.testGetHalfCheckedKeys = function () {
        const tree = document.querySelector("#methodTestTree");
        const result = tree.getHalfCheckedKeys();
        const resultDiv = document.getElementById("testResult");
        resultDiv.innerHTML = `
          <h3>getHalfCheckedKeys() 测试结果：</h3>
          <p>返回半选中key数量: ${result.length}</p>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
      };

      window.testGetCurrentKey = function () {
        const tree = document.querySelector("#methodTestTree");
        const result = tree.getCurrentKey();
        const resultDiv = document.getElementById("testResult");
        resultDiv.innerHTML = `
          <h3>getCurrentKey() 测试结果：</h3>
          <p>当前选中节点的key: ${result === null ? "null" : result}</p>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
      };

      window.testGetCurrentNode = function () {
        const tree = document.querySelector("#methodTestTree");
        const result = tree.getCurrentNode();
        const resultDiv = document.getElementById("testResult");
        resultDiv.innerHTML = `
          <h3>getCurrentNode() 测试结果：</h3>
          <p>当前选中节点数据: ${result === null ? "null" : "有数据"}</p>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
      };

      // 新增方法测试函数
      window.testUpdateKeyChildren = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 更新节点2的子节点
        const newChildren = [
          { id: 8, label: "新增子节点1" },
          { id: 9, label: "新增子节点2" },
        ];
        const result1 = tree.updateKeyChildren(2, newChildren);
        testResults.push(
          `测试1 - 更新节点2子节点: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 异常场景 - 不存在的节点
        const result2 = tree.updateKeyChildren(999, newChildren);
        testResults.push(
          `测试2 - 更新不存在节点: ${result2 ? "失败" : "成功"}`
        );

        // 测试3: 异常场景 - 叶子节点（无子节点）
        const result3 = tree.updateKeyChildren(4, newChildren);
        testResults.push(`测试3 - 更新叶子节点: ${result3 ? "成功" : "失败"}`);

        resultDiv.innerHTML = `
          <h3>updateKeyChildren() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testGetCheckedNodes = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 获取所有选中节点
        const result1 = tree.getCheckedNodes();
        testResults.push(`测试1 - 获取所有选中节点: ${result1.length} 个`);

        // 测试2: 只获取叶子节点
        const result2 = tree.getCheckedNodes(true);
        testResults.push(`测试2 - 只获取叶子节点: ${result2.length} 个`);

        // 测试3: 包含半选中节点
        const result3 = tree.getCheckedNodes(false, true);
        testResults.push(`测试3 - 包含半选中节点: ${result3.length} 个`);

        // 测试4: 异常场景 - 未设置 show-checkbox
        const tempTree = document.createElement("ea-tree");
        const result4 = tempTree.getCheckedNodes();
        testResults.push(
          `测试4 - 未设置show-checkbox: ${result4.length === 0 ? "成功（返回空数组）" : "失败"}`
        );

        resultDiv.innerHTML = `
          <h3>getCheckedNodes() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
          <h4>选中节点详情：</h4>
          <pre>${JSON.stringify(result1, null, 2)}</pre>
        `;
      };

      window.testSetCheckedNodes = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 设置选中节点
        const nodesToCheck = [
          {
            id: 6,
            label: "Level three 3-2-1",
          },
          {
            id: 7,
            label: "Level three 3-2-2",
            disabled: true,
          },
        ];
        const result1 = tree.setCheckedNodes(nodesToCheck);
        testResults.push(`测试1 - 设置选中节点: ${result1 ? "成功" : "失败"}`);

        // 测试2: 只设置叶子节点
        const leafNodes = [
          { id: 4, label: "Level three 3-1-1" },
          { id: 6, label: "Level three 3-2-1" },
        ];
        const result2 = tree.setCheckedNodes(leafNodes, true);
        testResults.push(
          `测试2 - 只设置叶子节点: ${result2 ? "成功" : "失败"}`
        );

        // 测试3: 异常场景 - 未设置 node-key
        const tempTree = document.createElement("ea-tree");
        const result3 = tempTree.setCheckedNodes(nodesToCheck);
        testResults.push(
          `测试3 - 未设置node-key: ${result3 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>setCheckedNodes() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testGetCheckedKeys = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 获取所有选中key
        const result1 = tree.getCheckedKeys();
        testResults.push(`测试1 - 获取所有选中key: ${result1.length} 个`);

        // 测试2: 只获取叶子节点key
        const result2 = tree.getCheckedKeys(true);
        testResults.push(`测试2 - 只获取叶子节点key: ${result2.length} 个`);

        // 测试3: 异常场景 - 未设置 show-checkbox
        const tempTree = document.createElement("ea-tree");
        const result3 = tempTree.getCheckedKeys();
        testResults.push(
          `测试3 - 未设置show-checkbox: ${result3.length === 0 ? "成功（返回空数组）" : "失败"}`
        );

        resultDiv.innerHTML = `
          <h3>getCheckedKeys() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
          <h4>选中key详情：</h4>
          <pre>${JSON.stringify(result1, null, 2)}</pre>
        `;
      };

      window.testSetCheckedKeys = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 设置选中key
        const keysToCheck = [1, 3, 4];
        const result1 = tree.setCheckedKeys(keysToCheck);
        testResults.push(`测试1 - 设置选中key: ${result1 ? "成功" : "失败"}`);

        // 测试2: 只设置叶子节点key
        const leafKeys = [4, 6];
        const result2 = tree.setCheckedKeys(leafKeys, true);
        testResults.push(
          `测试2 - 只设置叶子节点key: ${result2 ? "成功" : "失败"}`
        );

        // 测试3: 异常场景 - 未设置 node-key
        const tempTree = document.createElement("ea-tree");
        const result3 = tempTree.setCheckedKeys(keysToCheck);
        testResults.push(
          `测试3 - 未设置node-key: ${result3 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>setCheckedKeys() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testSetChecked = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 通过key设置选中状态
        const result1 = tree.setChecked(1, true);
        testResults.push(
          `测试1 - 通过key设置选中: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 通过数据对象设置选中状态
        const nodeData = {
          id: 6,
          label: "Level three 3-2-1",
        };
        const result2 = tree.setChecked(nodeData, true);
        testResults.push(
          `测试2 - 通过数据设置选中: ${result2 ? "成功" : "失败"}`
        );

        // 测试4: 异常场景 - 不存在的节点
        const result4 = tree.setChecked(999, true);
        testResults.push(
          `测试4 - 设置不存在节点: ${result4 ? "失败" : "成功（预期失败）"}`
        );

        // 测试5: 异常场景 - 禁用节点
        const disabledNode = { id: 2, label: "Level two 2-2", disabled: true };
        const result5 = tree.setChecked(disabledNode, true);
        testResults.push(
          `测试5 - 设置禁用节点: ${result5 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>setChecked() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.runAllTests = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let allTestResults = [];

        // 运行所有测试
        allTestResults.push("=== 开始运行所有测试 ===");

        // 测试1: updateKeyChildren
        const newChildren = [{ id: 10, label: "测试子节点" }];
        const test1 = tree.updateKeyChildren(2, newChildren);
        allTestResults.push(`updateKeyChildren: ${test1 ? "通过" : "失败"}`);

        // 测试2: getCheckedNodes
        const test2 = tree.getCheckedNodes();
        allTestResults.push(`getCheckedNodes: 返回 ${test2.length} 个节点`);

        // 测试3: setCheckedNodes
        const test3 = tree.setCheckedNodes([{ id: 1, label: "Level one 1" }]);
        allTestResults.push(`setCheckedNodes: ${test3 ? "通过" : "失败"}`);

        // 测试4: getCheckedKeys
        const test4 = tree.getCheckedKeys();
        allTestResults.push(`getCheckedKeys: 返回 ${test4.length} 个key`);

        // 测试5: setCheckedKeys
        const test5 = tree.setCheckedKeys([1, 3]);
        allTestResults.push(`setCheckedKeys: ${test5 ? "通过" : "失败"}`);

        // 测试6: setChecked
        const test6 = tree.setChecked(4, true);
        allTestResults.push(`setChecked: ${test6 ? "通过" : "失败"}`);

        // 测试7: setCurrentKey
        const test7 = tree.setCurrentKey(3);
        allTestResults.push(`setCurrentKey: ${test7 ? "通过" : "失败"}`);

        // 测试8: setCurrentNode
        const test8 = tree.setCurrentNode(4);
        allTestResults.push(`setCurrentNode: ${test8 ? "通过" : "失败"}`);

        // 测试9: getNode
        const test9 = tree.getNode(3);
        allTestResults.push(`getNode: ${test9 ? "通过" : "失败"}`);

        // 测试10: append
        const test10 = tree.append({ id: 50, label: "批量测试节点" }, 3);
        allTestResults.push(`append: ${test10 ? "通过" : "失败"}`);

        // 测试11: insertBefore
        const test11 = tree.insertBefore({ id: 51, label: "前插节点" }, 4);
        allTestResults.push(`insertBefore: ${test11 ? "通过" : "失败"}`);

        // 测试12: insertAfter
        const test12 = tree.insertAfter({ id: 52, label: "后插节点" }, 4);
        allTestResults.push(`insertAfter: ${test12 ? "通过" : "失败"}`);

        // 测试13: remove
        const test13 = tree.remove(6);
        allTestResults.push(`remove: ${test13 ? "通过" : "失败"}`);

        allTestResults.push("=== 测试完成 ===");

        resultDiv.innerHTML = `
          <h3>所有测试结果：</h3>
          <ul>${allTestResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      // 最新方法测试函数
      window.testSetCurrentKey = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 通过key设置选中状态
        const result1 = tree.setCurrentKey(3);
        testResults.push(
          `测试1 - 通过key设置选中: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 取消选中状态
        const result2 = tree.setCurrentKey(null);
        testResults.push(`测试2 - 取消选中状态: ${result2 ? "成功" : "失败"}`);

        // 测试3: 不自动展开父节点
        const result3 = tree.setCurrentKey(4, false);
        testResults.push(
          `测试3 - 不自动展开父节点: ${result3 ? "成功" : "失败"}`
        );

        // 测试4: 异常场景 - 不存在的节点
        const result4 = tree.setCurrentKey(999);
        testResults.push(
          `测试4 - 设置不存在节点: ${result4 ? "失败" : "成功（预期失败）"}`
        );

        // 测试5: 异常场景 - 禁用节点
        const result5 = tree.setCurrentKey(2);
        testResults.push(
          `测试5 - 设置禁用节点: ${result5 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>setCurrentKey() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testSetCurrentNode = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 通过数据对象设置选中状态
        const nodeData = {
          id: 3,
          label: "Level two 2-1",
          children: [
            {
              id: 4,
              label: "Level three 3-1-1",
            },
            {
              id: 5,
              label: "Level three 3-1-2",
              disabled: true,
            },
          ],
        };
        const result1 = tree.setCurrentNode(nodeData);
        testResults.push(
          `测试1 - 通过数据设置选中: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 通过key设置选中状态
        const result2 = tree.setCurrentNode(4);
        testResults.push(
          `测试2 - 通过key设置选中: ${result2 ? "成功" : "失败"}`
        );

        // 测试3: 不自动展开父节点
        const result3 = tree.setCurrentNode(6, false);
        testResults.push(
          `测试3 - 不自动展开父节点: ${result3 ? "成功" : "失败"}`
        );

        // 测试4: 异常场景 - 不存在的节点
        const result4 = tree.setCurrentNode({ id: 999, label: "不存在" });
        testResults.push(
          `测试4 - 设置不存在节点: ${result4 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>setCurrentNode() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testGetNode = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 通过key获取节点
        const result1 = tree.getNode(3);
        testResults.push(
          `测试1 - 通过key获取节点: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 通过数据对象获取节点
        const nodeData = { id: 4, label: "Level three 3-1-1" };
        const result2 = tree.getNode(nodeData);
        testResults.push(
          `测试2 - 通过数据获取节点: ${result2 ? "成功" : "失败"}`
        );

        // 测试3: 异常场景 - 不存在的节点
        const result3 = tree.getNode(999);
        testResults.push(
          `测试3 - 获取不存在节点: ${result3 === null ? "成功（返回null）" : "失败"}`
        );

        // 测试4: 异常场景 - 未设置node-key
        const tempTree = document.createElement("ea-tree");
        const result4 = tempTree.getNode(3);
        testResults.push(
          `测试4 - 未设置node-key: ${result4 === null ? "成功（返回null）" : "失败"}`
        );

        resultDiv.innerHTML = `
          <h3>getNode() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
          <h4>获取的节点详情：</h4>
          <pre>${JSON.stringify(result1, null, 2)}</pre>
        `;
      };

      window.testRemove = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 通过key删除节点
        const result1 = tree.remove(6);
        testResults.push(
          `测试1 - 通过key删除节点: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 通过数据对象删除节点
        const nodeData = { id: 7, label: "Level three 3-2-2", disabled: true };
        const result2 = tree.remove(nodeData);
        testResults.push(
          `测试2 - 通过数据删除节点: ${result2 ? "成功" : "失败"}`
        );

        // 测试3: 异常场景 - 不存在的节点;
        const result3 = tree.remove(999);
        testResults.push(
          `测试3 - 删除不存在节点: ${result3 ? "失败" : "成功（预期失败）"}`
        );

        // 测试4: 异常场景 - 未设置node-key
        const tempTree = document.createElement("ea-tree");
        const result4 = tempTree.remove(3);
        testResults.push(
          `测试4 - 未设置node-key: ${result4 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>remove() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testAppend = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 通过key追加子节点
        const newNode = { id: 20, label: "追加的子节点" };
        const result1 = tree.append(newNode, 3);
        testResults.push(
          `测试1 - 通过key追加子节点: ${result1 ? "成功" : "失败"}`
        );

        // 测试2: 通过数据对象追加子节点
        const newNode2 = { id: 21, label: "追加的子节点2" };
        const parentData = { id: 3, label: "Level two 2-1" };
        const result2 = tree.append(newNode2, parentData);
        testResults.push(
          `测试2 - 通过数据追加子节点: ${result2 ? "成功" : "失败"}`
        );

        // 测试3: 异常场景 - 不存在的父节点
        const result3 = tree.append(newNode, 999);
        testResults.push(
          `测试3 - 向不存在父节点追加: ${result3 ? "失败" : "成功（预期失败）"}`
        );

        // 测试4: 异常场景 - 叶子节点（不能有子节点）
        const result4 = tree.append(newNode, 4);
        testResults.push(
          `测试4 - 向叶子节点追加: ${result4 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>append() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testInsertBefore = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 在节点前插入
        const newNode = { id: 30, label: "前插入的节点" };
        const result1 = tree.insertBefore(newNode, 4);
        testResults.push(`测试1 - 在节点前插入: ${result1 ? "成功" : "失败"}`);

        // 测试2: 通过数据对象插入
        const newNode2 = { id: 31, label: "前插入的节点2" };
        const refData = { id: 6, label: "Level three 3-2-1" };
        const result2 = tree.insertBefore(newNode2, refData);
        testResults.push(`测试2 - 通过数据插入: ${result2 ? "成功" : "失败"}`);

        // 测试3: 异常场景 - 不存在的参考节点
        const result3 = tree.insertBefore(newNode, 999);
        testResults.push(
          `测试3 - 向不存在节点前插入: ${result3 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>insertBefore() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };

      window.testInsertAfter = function () {
        const tree = document.querySelector("#methodTestTree");
        const resultDiv = document.getElementById("testResult");
        let testResults = [];

        // 测试1: 正常场景 - 在节点后插入
        const newNode = { id: 40, label: "后插入的节点" };
        const result1 = tree.insertAfter(newNode, 4);
        testResults.push(`测试1 - 在节点后插入: ${result1 ? "成功" : "失败"}`);

        // 测试2: 通过数据对象插入
        const newNode2 = { id: 41, label: "后插入的节点2" };
        const refData = { id: 6, label: "Level three 3-2-1" };
        const result2 = tree.insertAfter(newNode2, refData);
        testResults.push(`测试2 - 通过数据插入: ${result2 ? "成功" : "失败"}`);

        // 测试3: 异常场景 - 不存在的参考节点
        const result3 = tree.insertAfter(newNode, 999);
        testResults.push(
          `测试3 - 向不存在节点后插入: ${result3 ? "失败" : "成功（预期失败）"}`
        );

        resultDiv.innerHTML = `
          <h3>insertAfter() 测试结果：</h3>
          <ul>${testResults.map(r => `<li>${r}</li>`).join("")}</ul>
        `;
      };
    </script>
