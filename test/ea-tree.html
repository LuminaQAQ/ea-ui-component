<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tree</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-tree/index.js"></script>

    <script>
      window.data = [
        {
          label: "Level one 1",
          children: [
            {
              label: "Level two 1-1",
              children: [
                {
                  label: "Level three 1-1-1",
                },
              ],
            },
          ],
        },
        {
          label: "Level one 2",
          children: [
            {
              label: "Level two 2-1",
              children: [
                {
                  label: "Level three 2-1-1",
                },
              ],
            },
            {
              label: "Level two 2-2",
              children: [
                {
                  label: "Level three 2-2-1",
                },
              ],
            },
          ],
        },
        {
          label: "Level one 3",
          children: [
            {
              label: "Level two 3-1",
              children: [
                {
                  label: "Level three 3-1-1",
                },
              ],
            },
            {
              label: "Level two 3-2",
              children: [
                {
                  label: "Level three 3-2-1",
                },
              ],
            },
          ],
        },
      ];

      window.disabledData = [
        {
          id: 1,
          label: "Level one 1",
          children: [
            {
              id: 3,
              label: "Level two 2-1",
              children: [
                {
                  id: 4,
                  label: "Level three 3-1-1",
                },
                {
                  id: 5,
                  label: "Level three 3-1-2",
                  disabled: true,
                },
              ],
            },
            {
              id: 2,
              label: "Level two 2-2",
              disabled: true,
              children: [
                {
                  id: 6,
                  label: "Level three 3-2-1",
                },
                {
                  id: 7,
                  label: "Level three 3-2-2",
                  disabled: true,
                },
              ],
            },
          ],
        },
      ];
    </script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-tree id="basicTree"></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#basicTree");

      tree.data = window.data;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  可选择 -->
    <!-- #region -->
    <h1>可选择</h1>

    <div class="demo">
      <ea-tree id="checkboxTree" show-checkbox></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#checkboxTree");
      tree.data = window.data;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  禁用复选框 -->
    <!-- #region -->
    <h1>禁用复选框</h1>

    <div class="demo">
      <ea-tree id="disabledCheckboxTree" show-checkbox></ea-tree>
    </div>

    <script type="module">
      const tree = document.querySelector("#disabledCheckboxTree");
      tree.data = window.disabledData;
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
