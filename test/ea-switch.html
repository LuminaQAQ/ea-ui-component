<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-switch/index.ts"></script>
    <!-- <script type="module" src="../src/components/ea-tooltip/index.ts"></script>
    <script type="module" src="../src/components/ea-message/index.ts"></script> -->

    <!-- -------- 基本用法 --------  -->
    <!-- #region  -->
    <h2>基本用法</h2>
    <div class="demo">
      <ea-switch name="basic"></ea-switch>
      <ea-switch
        name="basicHasText"
        value="true"
        style="
          --ea-switch-active-bg-color: #13ce66;
          --ea-switch-inactive-bg-color: #ff4949;
        "
      ></ea-switch>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  尺寸 -->
    <!-- #region -->
    <h1>尺寸</h1>

    <div class="demo">
      <ea-switch
        name="basic"
        value="true"
        size="large"
        active-text="Open"
        inactive-text="Close"
      ></ea-switch>
      <br />
      <ea-switch
        name="basic"
        value="true"
        active-text="Open"
        inactive-text="Close"
      ></ea-switch>
      <br />
      <ea-switch
        name="basic"
        value="true"
        size="small"
        active-text="Open"
        inactive-text="Close"
      ></ea-switch>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  文字描述 -->
    <!-- #region -->
    <h1>文字描述</h1>

    <div class="demo">
      <ea-switch
        value="true"
        active-text="Pay by month"
        inactive-text="Pay by year"
      ></ea-switch>
      <br />
      <ea-switch
        value="true"
        active-text="Pay by month"
        inactive-text="Pay by year"
        style="
          --ea-switch-active-bg-color: #13ce66;
          --ea-switch-inactive-bg-color: #ff4949;
        "
      ></ea-switch>
      <br />
      <ea-switch
        value="true"
        style="
          --ea-switch-active-bg-color: #13ce66;
          --ea-switch-inactive-bg-color: #ff4949;
        "
      >
        <ea-icon name="ban" slot="inactive"></ea-icon>
        <ea-icon name="check" slot="active"></ea-icon>
      </ea-switch>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  扩展的 value 类型 -->
    <!-- #region -->
    <h1>扩展的 value 类型</h1>

    <div class="demo">
      <ea-tooltip id="extTooltip" content="1111" placement="top-start">
        <ea-switch
          id="extSwitch"
          slot="reference"
          placement="top"
          value="100"
          style="
            --ea-switch-active-bg-color: #13ce66;
            --ea-switch-inactive-bg-color: #ff4949;
          "
          active-value="100"
          inactive-value="0"
        ></ea-switch>
      </ea-tooltip>

      <ea-switch
        id="extSwitch"
        slot="reference"
        placement="top"
        value="world"
        active-value="hello"
        inactive-value="world"
      ></ea-switch>
    </div>

    <script type="module">
      const extExample = {
        tooltip: document.querySelector("#extTooltip"),
        switch: document.querySelector("#extSwitch"),

        init() {
          const getContentString = value =>
            `Switch value: ${value === 100 ? "100" : "0"}`;

          this.tooltip.setAttribute(
            "content",
            getContentString(this.switch.value)
          );

          this.switch.addEventListener("change", e => {
            this.tooltip.setAttribute(
              "content",
              getContentString(e.target.value)
            );
          });
        },
      };
      extExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!-- -------- 禁用状态 --------  -->
    <!-- #region  -->
    <h2>禁用状态</h2>
    <div class="demo">
      <ea-switch disabled></ea-switch>
      <ea-switch
        value="true"
        active-text="Pay by month"
        inactive-text="Pay by year"
        disabled
      ></ea-switch>
    </div>
    <hr />
    <!-- #endregion  -->
    <!-- -------------------  -->

    <!--  阻止切换 -->
    <!-- #region -->
    <h1>阻止切换</h1>

    <div class="demo">
      <ea-switch id="forbiddenSwitch1"></ea-switch>
      <ea-switch id="forbiddenSwitch2"></ea-switch>
    </div>

    <script type="module">
      const forbiddenExample = {
        switch1: document.querySelector("#forbiddenSwitch1"),
        switch2: document.querySelector("#forbiddenSwitch2"),

        init() {
          this.switch1.beforeChange = () => {
            this.switch1.setAttribute("disabled", true);

            return new Promise(resolve => {
              setTimeout(() => {
                this.switch1.removeAttribute("disabled", false);

                // window.$message.success("Switch success");
                return resolve(true);
              }, 1000);
            });
          };

          this.switch2.beforeChange = () => {
            this.switch2.toggleAttribute("disabled", true);

            return new Promise((resolve, reject) => {
              setTimeout(() => {
                this.switch2.toggleAttribute("disabled", false);
                // window.$message.error("Switch failed");
                return reject(new Error("Error"));
              }, 1000);
            });
          };
        },
      };
      forbiddenExample.init();
    </script>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->
  </body>
</html>
