<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../dist/assets/icon.css" />

    <style>
      hr {
        margin: 3rem 0;
      }
    </style>
  </head>

  <body>
    <script type="module" src="../src/components/ea-select/index.js"></script>
    <script type="module" src="../src/components/ea-button/index.js"></script>
    <script type="module" src="../src/components/ea-empty/index.js"></script>

    <form>
      <ea-select placeholder="Select" style="width: 240px">
        <ea-option label="Option 1" value="Option1">Option 1</ea-option>
        <ea-option label="Option 2" value="Option2">Option 2</ea-option>
        <ea-option label="Option 3" value="Option3">Option 3</ea-option>
        <ea-option label="Option 4" value="Option4">Option 4</ea-option>
        <ea-option label="Option 5" value="Option5">Option 5</ea-option>
      </ea-select>

      <ea-button button-type="submit">submit</ea-button>
      <ea-button id="show">show</ea-button>
    </form>

    <script type="module">
      const form = document.querySelector("form");
      const select = document.querySelector("ea-select");
      const button = document.querySelector("ea-button[button-type='button']");
      const button2 = document.querySelector("#show");

      form.addEventListener("submit", e => {
        e.preventDefault();
        console.log(select.value);
      });

      button2.addEventListener("click", e => {
        select.show();
      });
    </script>

    <!--  基础用法 -->
    <!-- #region -->
    <h1>基础用法</h1>

    <div class="demo">
      <ea-select placeholder="Select" style="width: 240px">
        <ea-option label="Option 1" value="Option1">Option 1</ea-option>
        <ea-option label="Option 2" value="Option2">Option 2</ea-option>
        <ea-option label="Option 3" value="Option3">Option 3</ea-option>
        <ea-option label="Option 4" value="Option4">Option 4</ea-option>
        <ea-option label="Option 5" value="Option5">Option 5</ea-option>
      </ea-select>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <!--  有禁用选项 -->
    <!-- #region -->
    <h1>有禁用选项</h1>

    <div class="demo">
      <ea-select placeholder="Select" style="width: 240px">
        <ea-option label="Option 1" value="Option1">Option 1</ea-option>
        <ea-option label="Option 2" value="Option2" disabled>
          Option 2
        </ea-option>
        <ea-option label="Option 3" value="Option3">Option 3</ea-option>
        <ea-option label="Option 4" value="Option4">Option 4</ea-option>
        <ea-option label="Option 5" value="Option5">Option 5</ea-option>
      </ea-select>
    </div>

    <hr />
    <!-- #endregion  -->
    <!-- end  -->

    <hr />

    <!-- -------- 3. 禁用状态 --------  -->
    <!-- #region  -->
    <ea-select placeholder="请选择" disabled>
      <ea-option value="1">选项1</ea-option>
      <ea-option value="2">选项2</ea-option>
      <ea-option value="3">选项3</ea-option>
      <ea-option value="4">选项4</ea-option>
    </ea-select>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <hr />

    <!-- -------- 4. 可清空单选 --------  -->
    <!-- #region  -->
    <ea-select placeholder="请选择" clearable>
      <ea-option value="北京">北京</ea-option>
      <ea-option value="上海">上海</ea-option>
      <ea-option value="广州">广州</ea-option>
      <ea-option value="深圳">深圳</ea-option>
    </ea-select>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <hr />

    <!-- -------- 5. 自定义模板 --------  -->
    <!-- #region  -->
    <ea-select placeholder="请选择" clearable>
      <style>
        .ea-select_option-wrap {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .ea-select_option-eng {
          font-size: 10px;
        }
      </style>
      <ea-option value="北京">
        <div class="ea-select_option-wrap">
          <div class="ea-select_option-text">北京</div>
          <div class="ea-select_option-eng">Beijing</div>
        </div>
      </ea-option>
      <ea-option value="上海">
        <div class="ea-select_option-wrap">
          <div class="ea-select_option-text">上海</div>
          <div class="ea-select_option-eng">Shanghai</div>
        </div>
      </ea-option>
      <ea-option value="广州">
        <div class="ea-select_option-wrap">
          <div class="ea-select_option-text">广州</div>
          <div class="ea-select_option-eng">Guangzhou</div>
        </div>
      </ea-option>
      <ea-option value="深圳">
        <div class="ea-select_option-wrap">
          <div class="ea-select_option-text">深圳</div>
          <div class="ea-select_option-eng">Shenzhen</div>
        </div>
      </ea-option>
    </ea-select>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <hr />

    <!-- -------- 6. 分组 --------  -->
    <!-- #region  -->
    <ea-select placeholder="请选择">
      <ea-option-group label="热门城市">
        <ea-option value="北京">北京</ea-option>
        <ea-option value="上海">上海</ea-option>
      </ea-option-group>
      <ea-option-group label="一分别想带回家城市">
        <ea-option value="广州">广州</ea-option>
        <ea-option value="深圳">深圳</ea-option>
      </ea-option-group>
    </ea-select>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <hr />

    <!-- -------- 6. 分组 --------  -->
    <!-- #region  -->
    <ea-select placeholder="请选择" filterable>
      <ea-option value="北京">北京</ea-option>
      <ea-option value="上海">上海</ea-option>
      <ea-option value="广州">广州</ea-option>
      <ea-option value="深圳">深圳</ea-option>
      <div slot="empty">
        <ea-empty image-size="100"></ea-empty>
      </div>
    </ea-select>
    <!-- #endregion  -->
    <!-- -------------------  -->

    <hr />

    <!-- -------- 7. 基础多选 --------  -->
    <!-- #region  -->
    <ea-select placeholder="请选择" multiple>
      <ea-option value="北京">北京</ea-option>
      <ea-option value="上海">上海</ea-option>
      <ea-option value="广州">广州</ea-option>
      <ea-option value="深圳">深圳</ea-option>
    </ea-select>
    <!-- #endregion  -->
    <!-- -------------------  -->
  </body>
</html>
